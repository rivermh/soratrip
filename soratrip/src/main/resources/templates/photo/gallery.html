<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{photo.title}">SoraTrip - 사진</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container" style="max-width: 900px;">
        <span class="eyebrow">Gallery</span>
        <h2 th:text="#{photo.title}" style="margin-bottom: 24px;">📷 사진</h2>

        <!-- 등록된 사진이 없을 경우 -->
        <div th:if="${#lists.isEmpty(photos)}" style="text-align: center; padding: 48px 20px; color: var(--text-faint); background: var(--surface); border-radius: var(--radius); border: 1px dashed var(--border-color);" th:text="#{photo.empty}">
            등록된 사진이 없습니다.
        </div>

        <!-- 사진 그리드 목록 -->
        <div th:unless="${#lists.isEmpty(photos)}" class="photo-grid" style="margin-bottom: 32px;">
            <div th:each="p : ${photos}" class="photo-grid-item">
                <img th:src="@{${p.imageUrl}}" th:alt="${p.caption}">
                <div style="margin-top: 8px;">
                    <span class="badge" style="font-size: 11px; padding: 2px 8px; background: var(--primary-soft); color: var(--primary-color); border-color: #c9e0fb;" th:text="${p.scheduleDay.dayNumber} + '일차'">1일차</span>
                </div>
                <div th:if="${p.caption != null and !#strings.isEmpty(p.caption)}" style="font-size: 13px; color: var(--text-main); margin-top: 4px; word-break: break-all;" th:text="${p.caption}">설명</div>
            </div>
        </div>

        <!-- 하단 버튼 영역 -->
        <div>
            <a th:href="@{/schedules/{id}(id=${scheduleId})}" class="btn btn-secondary" style="width: auto; text-decoration: none;" th:text="#{post.back_to_list}">📋 일정으로 돌아가기</a>
        </div>
    </div>
</body>
</html>
