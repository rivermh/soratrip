# 배포(Railway) 환경 전용 설정. SPRING_PROFILES_ACTIVE=prod 로 활성화한다.
# 여기 들어가는 값은 전부 실제 시크릿이 아니라 "어떤 환경변수를 읽을지"만 정의하므로
# 이 파일 자체는 git에 커밋해도 안전하다 (application-secret.yml과 다름).

server:
  # Railway는 TLS를 프록시 단에서 종료하고 내부로는 HTTP로 전달한다.
  # 이 설정이 없으면 X-Forwarded-Proto 헤더를 무시해서 OAuth2 리다이렉트 URI가
  # https 대신 http로 잘못 생성되고, secure 쿠키도 안 붙는다.
  forward-headers-strategy: framework

spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}

  data:
    redis:
      host: ${REDISHOST}
      port: ${REDISPORT}
      password: ${REDISPASSWORD}

  jpa:
    properties:
      hibernate:
        show_sql: false
        highlight_sql: false

  mail:
    password: ${RESEND_API_KEY}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

# 커스텀 도메인 인증 완료 후의 발신 주소로 교체 (샌드박스 주소 대신)
mail:
  from: noreply@soratrip.app

google:
  maps:
    key: ${GOOGLE_MAPS_KEY}

openrouter:
  api:
    key: ${OPENROUTER_API_KEY}

weather:
  api:
    key: ${WEATHER_API_KEY}

# Railway Volume을 이 경로에 마운트해야 재배포 시 업로드 사진이 사라지지 않는다.
file:
  upload-dir: /data/uploads

logging:
  level:
    root: INFO
    com.rivermh.soratrip: INFO
    org.hibernate.SQL: WARN
