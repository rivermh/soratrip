<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{member.join.title}">📝 회원가입 - SoraTrip</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- 중앙 정렬 폼 컨테이너 -->
    <main class="container form-container" style="margin-top: 40px;">
        
        <!-- 상단 헤딩 & 브랜드 포인트 -->
        <div style="text-align: center; margin-bottom: 28px;">
            <span class="eyebrow">Join SoraTrip</span>
            <h2 th:text="#{member.join.title}">📝 회원가입</h2>
        </div>

        <!-- 회원가입 폼 -->
        <form th:action="@{/members/join}" method="post">
            <div class="form-group">
                <label th:text="#{member.email}">이메일</label>
                <input type="email" name="email" class="form-control" required
                       placeholder="example@soratrip.com" />
            </div>

            <div class="form-group">
                <label th:text="#{member.password}">비밀번호</label>
                <input type="password" name="password" class="form-control" required 
                       th:placeholder="#{member.password.placeholder}"
                       placeholder="비밀번호를 입력하세요" />
            </div>

            <div class="form-group">
                <label th:text="#{member.nickname}">닉네임</label>
                <input type="text" name="nickname" class="form-control" required 
                       th:placeholder="#{member.nickname.placeholder}"
                       placeholder="사용할 닉네임을 입력하세요" />
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 10px;" th:text="#{btn.join}">가입하기</button>
        </form>

        <!-- 하단 로그인 안내 링크 -->
        <div style="margin-top: 24px; text-align: center; font-size: 14px; color: var(--text-sub);">
            <span th:text="#{member.has_account}">이미 계정이 있으신가요?</span>
            <a th:href="@{/members/login}" style="color: var(--primary-color); font-weight: 600; text-decoration: none;" th:text="#{nav.login}">로그인</a>
        </div>

    </main>

</body>
</html>
