<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- 1. common.html 파일의 head 프래그먼트 불러오기 -->
<head th:replace="~{fragments/common :: head(~{::title})}">
    <title th:text="#{site.title}">SoraTrip - 한일 여행 & 동행</title>
</head>

<body>

    <!-- 2. header.html 파일의 header 프래그먼트 불러오기 -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- 3. 메인 콘텐츠 영역 -->
    <main class="container hero">
        <div class="hero-content">
            <span class="eyebrow">Sky Blue Journey</span>

            <h1 th:text="#{welcome.message}">✈️ SoraTrip에 오신 것을 환영합니다!</h1>
            <p class="hero-subtitle" th:text="#{sub.message}">한국과 일본을 잇는 자유로운 여행 & 동행 플랫폼</p>

            <div sec:authorize="isAuthenticated()" class="hero-welcome">
                <span class="badge" th:text="#{nav.welcome(${#authentication.name})}">OO님 환영합니다!</span>
            </div>

            <div class="hero-actions">
                <a sec:authorize="isAuthenticated()"
                   th:href="@{/schedules/ai-new}"
                   class="btn btn-ai">
                    ✨ AI 맞춤 일정 자동 생성
                </a>
                <a th:href="@{/schedules}" class="btn btn-primary" th:text="#{nav.schedule}">🗓️ 내 일정</a>
                <a th:href="@{/posts}" class="btn btn-secondary" th:text="#{main.board_btn}">✈️ 여행 & 동행 게시판 보러가기</a>
            </div>
        </div>
    </main>

    <!-- 4. footer.html 파일의 footer 프래그먼트 불러오기 -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
