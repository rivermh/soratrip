<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{error.title.404} + ' - SoraTrip'">페이지를 찾을 수 없습니다 - SoraTrip</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="container">
        <div class="error-container">
            <div class="error-icon">🧭</div>
            <div class="error-code" th:text="${status != null ? 'HTTP ' + status : 'HTTP 404'}">HTTP 404</div>

            <h2 class="error-title" th:text="#{error.title.404}">페이지를 찾을 수 없습니다</h2>
            <p class="error-message" th:text="#{error.message.404}">요청하신 페이지가 삭제되었거나 주소가 변경되었을 수 있습니다.</p>

            <div class="btn-group">
                <a href="javascript:history.back()" class="btn btn-secondary" th:text="#{error.back}">⬅️ 이전 페이지</a>
                <a href="/" class="btn btn-primary" th:text="#{error.home}">🏠 메인으로 가기</a>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
