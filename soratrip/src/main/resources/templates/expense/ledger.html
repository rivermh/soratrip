<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{expense.title} + ' - ' + ${schedule.title}">💰 가계부 - SoraTrip</title>

    <!-- Spring Security CSRF Meta 태그 (null 안전 처리) -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="container" style="max-width: 850px;">
        <span class="eyebrow">Finance</span>
        <h2 th:text="#{expense.title}" style="margin-bottom: 4px;">💰 가계부</h2>
        <p style="color: var(--text-sub); font-size: var(--text-sm); margin-bottom: var(--space-6);" th:text="${schedule.title}">3박 4일 도쿄 여행</p>

        <!-- 지출 요약 카드 (원화 환산 총액 + 엔화 총사용액) -->
        <div class="expense-summary" style="margin-bottom: var(--space-6);">
            <h3 th:text="#{expense.total}">총 지출</h3>
            <div class="expense-summary__total">
                <span>
                    ₩ <span th:text="${#numbers.formatDecimal(summary.totalKrw, 0, 'COMMA', 0, 'POINT')}">0</span>
                </span>
                <span th:if="${summary.totalJpy > 0}" class="expense-summary__jpy"
                      th:text="#{expense.jpy_total(${#numbers.formatDecimal(summary.totalJpy, 0, 'COMMA', 0, 'POINT')})}">(엔화 사용량: ¥ 0)</span>
            </div>
            <div th:unless="${summary.byCategory.isEmpty()}" class="expense-summary__categories">
                <span th:each="entry : ${summary.byCategory}" class="badge"
                      th:text="${entry.key.displayName} + ': ₩' + ${#numbers.formatDecimal(entry.value, 0, 'COMMA', 0, 'POINT')}">분류: ₩0</span>
            </div>

            <!-- 예산 진행률 (예산이 설정된 경우에만 표시) -->
            <div th:if="${summary.budgetKrw != null}" class="expense-budget">
                <div class="expense-budget__row">
                    <span th:text="#{expense.budget.label}">예산</span>
                    <span>
                        ₩<span th:text="${#numbers.formatDecimal(summary.totalKrw, 0, 'COMMA', 0, 'POINT')}">0</span>
                        / ₩<span th:text="${#numbers.formatDecimal(summary.budgetKrw, 0, 'COMMA', 0, 'POINT')}">0</span>
                        (<span th:text="${summary.percentUsed}">0</span>%)
                    </span>
                </div>
                <div class="expense-budget__bar">
                    <div class="expense-budget__bar-fill"
                         th:classappend="${summary.percentUsed >= 100} ? 'expense-budget__bar-fill--over' : ''"
                         th:style="'width: ' + ${summary.percentUsed > 100 ? 100 : summary.percentUsed} + '%'"></div>
                </div>
                <div th:if="${summary.percentUsed >= 100}" class="expense-budget__warning" th:text="#{expense.budget.over_warning}">
                    ⚠️ 설정한 예산을 초과했습니다.
                </div>
            </div>
        </div>

        <!-- 일자별로 묶어서 표시 -->
        <div class="day-timeline">
        <div th:each="day : ${schedule.days}" class="day-card">
            <div class="day-card__header">
                <h4 class="day-card__title">
                    <span class="day-badge" th:text="${day.dayNumber}">1</span>
                    <span th:text="#{schedule.day_title}">일차</span>
                    <span class="day-date" th:text="'(' + ${day.visitDate} + ')'">(2026-08-01)</span>
                </h4>
            </div>

            <div th:if="${#lists.isEmpty(expensesByDay.get(day.id))}" class="day-empty" th:text="#{expense.empty}">
                등록된 지출 내역이 없습니다.
            </div>

            <div th:each="e : ${expensesByDay.get(day.id)}" class="expense-row">
                <span th:text="${e.category.displayName} + (${e.memo != null and !#strings.isEmpty(e.memo)} ? ' - ' + ${e.memo} : '')">분류 - 메모</span>
                <span class="expense-row__amount">
                    <strong>
                        <span th:text="${e.currency.symbol}">¥</span>
                        <span th:text="${#numbers.formatDecimal(e.amount, 0, 'COMMA', 0, 'POINT')}">0</span>
                    </strong>
                    <span th:if="${e.currency.name() == 'JPY'}" class="expense-row__krw-note">
                        (≈ ₩<span th:text="${#numbers.formatDecimal(e.amountKrw, 0, 'COMMA', 0, 'POINT')}">0</span>)
                    </span>
                    <form th:if="${owner}" th:action="@{/schedules/{sid}/days/{did}/expenses/{eid}/delete(sid=${schedule.id},did=${day.id},eid=${e.id})}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-secondary btn-danger-ghost" style="padding: 1px 6px; font-size: 11px;">✕</button>
                    </form>
                </span>
                <div th:if="${e.paidBy != null and !e.sharedWith.isEmpty()}" class="expense-row__krw-note" style="width: 100%; margin-top: 2px;">
                    💸 <span th:text="${e.paidBy.name}">철수</span><span th:text="#{expense.paid_by.suffix}"> 냄</span>
                    · <span th:text="#{expense.shared_with}">나눈 사람</span>: <span th:text="${#strings.listJoin(e.sharedWith.![name], ', ')}">철수, 영희</span>
                </div>
            </div>

            <!-- 지출 등록 (소유자 전용) -->
            <form th:if="${owner}" th:action="@{/schedules/{sid}/days/{did}/expenses(sid=${schedule.id},did=${day.id})}" method="post" class="expense-form">
                <select name="category" class="form-control" required>
                    <option th:each="c : ${expenseCategories}" th:value="${c}" th:text="${c.displayName}">분류</option>
                </select>
                <select name="currency" class="form-control">
                    <option value="JPY" selected>JPY (¥)</option>
                    <option value="KRW">KRW (₩)</option>
                </select>
                <input type="number" step="any" name="amount" class="form-control" th:placeholder="#{expense.amount.placeholder}" placeholder="금액" required>
                <input type="number" step="0.01" name="exchangeRate" class="form-control" th:placeholder="#{schedule.exchange_rate.placeholder}" placeholder="환율(100엔당 원, 기본900)">
                <input type="text" name="memo" class="form-control" th:placeholder="#{expense.memo.placeholder}" placeholder="메모">

                <div th:if="${!#lists.isEmpty(participants)}" class="expense-form__settlement" style="width: 100%; display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-top: 4px;">
                    <select name="paidById" class="form-control" style="max-width: 160px;">
                        <option value="" th:text="#{expense.paid_by.none}">정산 미대상</option>
                        <option th:each="p : ${participants}" th:value="${p.id}" th:text="${p.name} + #{expense.paid_by.option_suffix}">철수님이 냄</option>
                    </select>
                    <span style="font-size: var(--text-xs); color: var(--text-faint);" th:text="#{expense.shared_with}">나눈 사람</span>
                    <label th:each="p : ${participants}" style="display: inline-flex; align-items: center; gap: 2px; font-size: var(--text-xs);">
                        <input type="checkbox" name="sharedWithIds" th:value="${p.id}">
                        <span th:text="${p.name}">철수</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" th:text="#{expense.add}">추가</button>
            </form>
        </div>
        </div>

        <!-- 하단 버튼 영역 -->
        <div style="margin-top: 30px;">
            <a th:href="@{/schedules/{id}(id=${schedule.id})}" class="btn btn-secondary" style="width: auto; text-decoration: none;" th:text="#{expense.back_to_schedule}">⬅️ 일정으로 돌아가기</a>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
