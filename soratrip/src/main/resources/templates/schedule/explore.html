<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{schedule.explore.title} + ' - SoraTrip'">🧭 다른 사람의 여행 일정 둘러보기 - SoraTrip</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="container">
        <div class="page-header-row">
            <h2 th:text="#{schedule.explore.title}">🧭 다른 사람의 여행 일정 둘러보기</h2>
            <a th:href="@{/schedules}" class="btn btn-secondary" style="width: auto;" th:text="#{nav.schedule}">🗓️ 내 일정</a>
        </div>

        <!-- 지역 / 태그 필터 -->
        <div class="filter-panel">
            <!-- 지역 필터 -->
            <div class="filter-group filter-row">
                <strong class="filter-label" th:text="#{post.region}">지역:</strong>
                <a th:href="@{/schedules/explore(tag=${selectedTag})}"
                   class="filter-chip"
                   th:classappend="${selectedRegion == null} ? 'active'"
                   th:text="#{post.filter.all}">전체</a>
                <a th:each="r : ${regions}"
                   th:href="@{/schedules/explore(region=${r}, tag=${selectedTag})}"
                   th:text="${r.displayName}"
                   class="filter-chip"
                   th:classappend="${selectedRegion == r} ? 'active'">지역</a>
            </div>

            <!-- 태그 필터 -->
            <div class="filter-group filter-row">
                <strong class="filter-label" th:text="#{schedule.tags.label}">태그:</strong>
                <a th:href="@{/schedules/explore(region=${selectedRegion})}"
                   class="filter-chip"
                   th:classappend="${selectedTag == null} ? 'active'"
                   th:text="#{post.filter.all}">전체</a>
                <a th:each="t : ${tags}"
                   th:href="@{/schedules/explore(region=${selectedRegion}, tag=${t})}"
                   th:text="${t.displayName}"
                   class="filter-chip"
                   th:classappend="${selectedTag == t} ? 'active'">태그</a>
            </div>
        </div>

        <!-- 일정 검색 결과 없음 -->
        <div th:if="${schedules.totalElements == 0}" class="empty-state" th:text="#{schedule.explore.empty}">
            아직 조건에 맞는 공개 여행 일정이 없습니다.
        </div>

        <!-- 일정 카드 목록 -->
        <div th:unless="${schedules.totalElements == 0}" class="schedule-grid">
            <div th:each="s : ${schedules}" th:with="ms=${mobilityScores.get(s.id)}" class="schedule-card">
                <div class="schedule-card__cover">
                    <span th:text="${s.region.displayName}" class="schedule-card__cover-region">TOKYO</span>
                    <span class="schedule-card__cover-author" th:text="${s.member.nickname}">작성자</span>
                </div>
                <div class="schedule-card__body">
                    <h3 class="schedule-card__title">
                        <a th:href="@{/schedules/{id}(id=${s.id})}" th:text="${s.title}">3박 4일 도쿄 여행</a>
                    </h3>

                    <p class="schedule-card__dates">
                        📅 <span th:text="${s.startDate}">2026-08-01</span> ~ <span th:text="${s.endDate}">2026-08-04</span>
                    </p>

                    <!-- 이동 편의성 스코어 배지 (리뷰 기반 자동 집계) -->
                    <div th:if="${ms != null and ms.reviewCount > 0}" class="mobility-badge"
                         th:classappend="'mobility-badge--' + ${#strings.toLowerCase(ms.level.name())}">
                        <span th:if="${ms.level.name() == 'GOOD'}" th:text="#{mobility.badge.good}">🟢 이동 편의 좋음</span>
                        <span th:if="${ms.level.name() == 'FAIR'}" th:text="#{mobility.badge.fair}">🟡 이동 편의 보통</span>
                        <span th:if="${ms.level.name() == 'LOW'}" th:text="#{mobility.badge.low}">🔴 이동 편의 주의</span>
                    </div>

                    <!-- 태그 노출 (이동 편의 태그 특화 강조) -->
                    <div class="schedule-card__tags">
                        <th:block th:each="t : ${s.tags}">
                            <!-- 이동 편의 / 배리어프리 태그는 파란 배지로 강조 -->
                            <span th:if="${t.barrierFree}"
                                  th:text="${t.displayName}" class="tag-chip tag-chip--transit">이동태그</span>
                            <span th:unless="${t.barrierFree}"
                                  th:text="${t.displayName}" class="tag-chip">일반태그</span>
                        </th:block>
                    </div>
                </div>

                <a th:href="@{/schedules/{id}(id=${s.id})}" class="btn btn-secondary schedule-card__cta" th:text="#{schedule.explore.view}">상세 일정 보기</a>
            </div>
        </div>

        <!-- 페이징 -->
        <div th:if="${schedules.totalPages > 1}" class="pagination">
            <a th:if="${schedules.hasPrevious()}"
               th:href="@{/schedules/explore(page=${schedules.number - 1}, region=${selectedRegion}, tag=${selectedTag})}"
               class="btn btn-secondary" style="width: auto; padding: 5px 12px;" th:text="#{page.prev}">이전</a>

            <span th:each="pageNumber : ${#numbers.sequence(0, schedules.totalPages - 1)}">
                <a th:href="@{/schedules/explore(page=${pageNumber}, region=${selectedRegion}, tag=${selectedTag})}"
                   th:text="${pageNumber + 1}"
                   th:classappend="${pageNumber == schedules.number} ? 'active'">1</a>
            </span>

            <a th:if="${schedules.hasNext()}"
               th:href="@{/schedules/explore(page=${schedules.number + 1}, region=${selectedRegion}, tag=${selectedTag})}"
               class="btn btn-secondary" style="width: auto; padding: 5px 12px;" th:text="#{page.next}">다음</a>
        </div>

        <div style="margin-top: 30px;">
            <a th:href="@{/}" class="btn btn-secondary" style="width: auto; text-decoration: none;" th:text="#{nav.home}">🏠 메인으로</a>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
