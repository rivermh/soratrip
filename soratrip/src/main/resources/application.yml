server:
  port: 8080

spring:
  # 1. 인코딩 설정 (Spring Boot 3.x 권장 위치로 이동)
  # 참고: Spring Boot 3.x는 기본이 UTF-8이므로 생략해도 무방합니다.
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    # 2. 사진 업로드 (Multipart) 설정 (spring.servlet 하위로 통합)
    multipart:
      max-file-size: 5MB
      max-request-size: 15MB

  # 3. 외부 보안 파일 임포트
  config:
    import: optional:classpath:application-secret.yml

  # 4. DB 설정 (MySQL)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/soratrip?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: sora_user

  # 5. JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        highlight_sql: true # SQL 로그 가독성을 위해 하이라이트 추가 (선택사항)
        default_batch_fetch_size: 100
    # generate-ddl: true  # ddl-auto가 설정되어 있으면 중복/불필요하므로 생략 가능합니다.

  # 6. Thymeleaf 템플릿 설정
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false # 개발 시 캐시 끎 (HTML 수정 즉시 반영)

  # 7. OAuth2 기본 설정
  security:
    oauth2:
      client:
        registration:
          google:
            scope:
              - profile
              - email

# 8. 커스텀 사진 업로드 저장 경로
file:
  upload-dir: uploads

# 9. 로그 출력 설정
# 9. 로그 출력 설정
logging:
  level:
    root: INFO
    com.rivermh.soratrip: INFO # 애플리케이션 로그를 INFO로 변경 (필요할 때만 DEBUG)
    org.hibernate.SQL: INFO # 실행되는 SQL문 출력 끄기 (ON: DEBUG)
    org.springframework.security: INFO # 시큐리티 디버그 로그 끄기
    org.hibernate.orm.jdbc.bind: INFO # SQL 파라미터 값 바인딩(TRACE) 로그 끄기