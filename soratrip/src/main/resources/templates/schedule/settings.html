<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{schedule.settings.title} + ' - SoraTrip'">⚙️ 일정 공개 설정 - SoraTrip</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container form-container" style="max-width: 480px;">
        <h2 th:text="#{schedule.settings.title}">⚙️ 일정 공개 설정</h2>
        <p style="color: #64748b; margin-bottom: 20px;" th:text="${schedule.title}">3박 4일 도쿄 여행</p>

        <form th:action="@{/schedules/{id}/settings(id=${schedule.id})}" method="post">
            <div class="form-group">
                <label>
                    <input type="checkbox" name="isPublic" value="true" th:checked="${schedule.public}">
                    <span th:text="#{schedule.settings.public}">이 일정을 공개하여 다른 사람이 둘러보고 복사할 수 있도록 허용</span>
                </label>
            </div>

            <div class="form-group">
                <label th:text="#{schedule.tags.label}">태그</label>
                <div>
                    <label th:each="t : ${tags}" style="display: inline-block; margin-right: 12px; font-weight: normal;">
                        <input type="checkbox" name="tags" th:value="${t}" th:checked="${schedule.tags.contains(t)}">
                        <span th:text="${t.displayName}">태그</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{btn.save}">등록</button>
        </form>

        <div style="margin-top: 20px;">
            <a th:href="@{/schedules/{id}(id=${schedule.id})}" class="btn btn-secondary" style="text-decoration: none;" th:text="#{btn.cancel}">취소</a>
        </div>
    </div>
</body>
</html>
