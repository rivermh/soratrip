<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{error.page.title}">오류가 발생했습니다 - SoraTrip</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="container">
        <div class="error-container">
            <div class="error-icon">🧭</div>

            <!-- HTTP 상태 코드 표시 -->
            <div class="error-code" th:text="${status != null ? 'HTTP ' + status : 'ERROR'}">HTTP 500</div>

            <!-- 상황별 맞춤 메시지 -->
            <h2 class="error-title" th:switch="${status}">
                <span th:case="404" th:text="#{error.title.404}">페이지를 찾을 수 없습니다</span>
                <span th:case="403" th:text="#{error.title.403}">접근 권한이 없습니다</span>
                <span th:case="500" th:text="#{error.title.500}">일시적인 시스템 오류입니다</span>
                <span th:case="*" th:text="#{error.title.default}">요청을 처리할 수 없습니다</span>
            </h2>

            <p class="error-message" th:switch="${status}">
                <span th:case="404" th:text="#{error.message.404}">요청하신 페이지가 삭제되었거나 주소가 변경되었을 수 있습니다.</span>
                <span th:case="403" th:text="#{error.message.403}">해당 페이지에 접근할 권한이 없습니다.</span>
                <span th:case="500" th:utext="#{error.message.500}">서버 처리 중 오류가 발생했습니다.<br>잠시 후 다시 시도해 주세요.</span>
                <span th:case="*" th:text="#{error.message.default}">서비스 이용에 불편을 드려 죄송합니다.</span>
            </p>

            <div class="btn-group">
                <a href="javascript:history.back()" class="btn btn-secondary" th:text="#{error.back}">⬅️ 이전 페이지</a>
                <a href="/" class="btn btn-primary" th:text="#{error.home}">🏠 메인으로 가기</a>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
