<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="${post.title} + ' - SoraTrip'">게시글 상세 - SoraTrip</title>

<!-- Security CSRF 메타 태그 (비동기 POST 필수) -->
<meta name="_csrf" th:content="${_csrf?.token}"/>
<meta name="_csrf_header" th:content="${_csrf?.headerName}"/>

<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<header th:replace="~{fragments/header :: header}"></header>

	<div class="container" style="max-width: 780px;">
		
		<!-- 카테고리 & 지역 배지 -->
		<div class="post-detail-badges">
			<span class="region-badge" th:text="${post.region.displayName}">도쿄</span>
			<span class="category-badge" th:text="${post.category.displayName}">동행</span>
		</div>

		<!-- 게시글 제목 -->
		<h2 class="post-detail-title" th:text="${post.title}">게시글 제목</h2>

		<!-- 작성자 & 조회수 정보 -->
		<div class="post-detail-meta">
			<div>
				<span th:text="#{post.writer}">작성자</span>:
				<strong th:text="${post.writerNickname}" style="color: var(--text-main);">닉네임</strong>
			</div>
			<div class="post-detail-meta__divider">|</div>
			<div>
				<span th:text="#{post.views}">조회수</span>:
				<span th:text="${post.viewCount}">0</span>
			</div>
		</div>

		<!-- 동행 정보 카드 (여행 일정 및 모집 인원) -->
		<div th:if="${post.travelStartDate != null}" class="post-info-box">
			<p>
				🗓️ <strong th:text="#{post.schedule}">여행 일정:</strong>
				<span th:text="${post.travelStartDate}"></span> ~ <span th:text="${post.travelEndDate}"></span>
			</p>
			<p>
				👥 <strong th:text="#{post.recruitment}">모집 인원:</strong>
				<span th:text="${post.recruitmentCount}" style="color: var(--primary-color); font-weight: 700;"></span><span th:text="#{post.recruitment.unit}">명</span>
			</p>
		</div>

		<!-- 본문 내용 -->
		<div class="post-content" th:text="${post.content}">본문 내용이 들어가는 자리입니다.</div>

		<!-- 📍 약속 / 추천 장소 지도 표시 영역 (위도/경도 존재 시 노출) -->
		<div th:if="${post.latitude != null and post.longitude != null}" class="post-place-box">
			<h3 th:text="#{post.place.title}">📍 약속 / 추천 장소</h3>
			<p>
				<strong th:text="${post.placeName}" style="color: var(--primary-color);">장소명</strong>
				(<span th:text="${post.placeAddress}">주소</span>)
			</p>

			<!-- 지도가 뿌려지는 영역 -->
			<div id="map" class="map-container"></div>
		</div>

		<!-- ❤️ 좋아요 버튼 영역 (초기 liked 상태 반영) -->
		<div style="text-align: center; margin: 36px 0 20px 0;">
			<button id="likeBtn" type="button" th:onclick="'togglePostLike(' + ${post.id} + ')'"
			        th:style="${post.liked} 
			            ? 'display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px; border-radius: 50px; border: 1px solid #e11d48; background-color: #e11d48; color: #ffffff; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;'
			            : 'display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px; border-radius: 50px; border: 1px solid #fca5a5; background-color: #fff1f2; color: #e11d48; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;'">
				<span>❤️</span>
				<span th:text="#{post.like}">좋아요</span>
				<span id="likeCount" th:text="${post.likeCount}">0</span>
			</button>
		</div>

		<hr style="border: none; border-top: 1px solid var(--border-light); margin: 36px 0;">

		<!-- 💬 댓글 섹션 -->
		<h3 style="font-size: 20px; margin-bottom: 20px;">
			💬 <span th:text="#{comment.title}">댓글</span> (<span th:text="${#lists.size(comments)}" style="color: var(--primary-color);">0</span>)
		</h3>

		<!-- 댓글 작성 폼 (로그인한 사용자만) -->
		<div sec:authorize="isAuthenticated()" style="margin-bottom: 28px;">
			<form th:action="@{/posts/{postId}/comments(postId=${post.id})}" th:object="${commentForm}" method="post" class="comment-form-row">
				<textarea th:field="*{content}" class="form-control" rows="2"
				          th:placeholder="#{comment.placeholder}"
				          placeholder="댓글을 입력하세요..." required style="resize: vertical; min-height: 60px;"></textarea>
				<button type="submit" class="btn btn-primary" th:text="#{comment.submit}">등록</button>
			</form>
		</div>

		<!-- 비로그인 안내 -->
		<div sec:authorize="isAnonymous()" class="comment-login-notice">
			<span th:text="#{comment.login_required.prefix}">댓글을 작성하려면 </span><a th:href="@{/members/login}" style="color: var(--primary-color); font-weight: 700; text-decoration: none;" th:text="#{member.login}">로그인</a><span th:text="#{comment.login_required.suffix}">이 필요합니다.</span>
		</div>

		<!-- 댓글 목록 -->
		<div class="comment-list">
			<div th:each="c : ${comments}" class="comment-card">
				<div class="comment-card__header">
					<strong class="comment-card__writer" th:text="${c.writerNickname}">작성자</strong>
					<div class="comment-card__actions">
						<span class="comment-card__date" th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd HH:mm')}">2026-03-07</span>

						<!-- 댓글 삭제 버튼 -->
						<form th:if="${c.owner}" th:action="@{/posts/{postId}/comments/{commentId}/delete(postId=${post.id}, commentId=${c.id})}" method="post" style="display: inline;">
							<button type="submit" onclick="return confirm('댓글을 삭제하시겠습니까?');" class="comment-delete-btn" th:text="#{comment.delete}">삭제</button>
						</form>
					</div>
				</div>
				<div class="comment-card__body" th:text="${c.content}">댓글 내용</div>
			</div>

			<!-- 댓글이 없을 경우 -->
			<div th:if="${#lists.isEmpty(comments)}" class="empty-state" th:text="#{comment.empty}">
				첫 번째 댓글을 작성해 보세요!
			</div>
		</div>

		<!-- 하단 버튼 영역 -->
		<div style="margin-top: 36px;">
			<a th:href="@{/posts}" class="btn btn-secondary" style="width: auto; text-decoration: none;" th:text="#{post.back_to_list}">📋 목록으로 돌아가기</a>
		</div>
	</div>

	<!-- ❤️ 좋아요 토글 스크립트 -->
	<script th:inline="javascript">
		function togglePostLike(postId) {
			const tokenMeta = document.querySelector("meta[name='_csrf']");
			const headerMeta = document.querySelector("meta[name='_csrf_header']");

			const headers = { 'Content-Type': 'application/json' };
			if (tokenMeta && headerMeta && tokenMeta.content && headerMeta.content) {
				headers[headerMeta.content] = tokenMeta.content;
			}

			fetch(`/api/posts/${postId}/like`, {
				method: 'POST',
				headers: headers
			})
			.then(response => {
				if (response.status === 401 || response.status === 403) {
					alert(/*[[#{common.login_required}]]*/ '로그인이 필요한 기능입니다.');
					return null;
				}
				if (!response.ok) {
					throw new Error(/*[[#{post.like.error}]]*/ '좋아요 처리 중 오류가 발생했습니다.');
				}
				return response.json();
			})
			.then(data => {
				if (!data) return;

				const likeCountEl = document.getElementById('likeCount');
				const likeBtn = document.getElementById('likeBtn');

				if (likeCountEl) likeCountEl.innerText = data.likeCount;

				if (likeBtn) {
					if (data.liked) {
						likeBtn.style.backgroundColor = '#e11d48';
						likeBtn.style.color = '#ffffff';
						likeBtn.style.borderColor = '#e11d48';
					} else {
						likeBtn.style.backgroundColor = '#fff1f2';
						likeBtn.style.color = '#e11d48';
						likeBtn.style.borderColor = '#fca5a5';
					}
				}
			})
			.catch(error => {
				console.error('Error:', error);
			});
		}
	</script>

	<!-- 🗺️ Google Maps JS API -->
	<script th:if="${post.latitude != null and post.longitude != null}" th:inline="javascript">
		function initMap() {
			const lat = /*[[${post.latitude}]]*/ 35.681236;
			const lng = /*[[${post.longitude}]]*/ 139.767125;
			const placeName = /*[[${post.placeName}]]*/ '장소명';
			const placeAddress = /*[[${post.placeAddress}]]*/ '주소';

			const location = { lat: lat, lng: lng };

			const map = new google.maps.Map(document.getElementById("map"), {
				zoom: 15,
				center: location,
			});

			const marker = new google.maps.Marker({
				position: location,
				map: map,
				title: placeName,
			});

			const infowindow = new google.maps.InfoWindow({
				content: `<div style="padding:5px; font-size:13px;"><strong>${placeName}</strong><br>${placeAddress}</div>`,
			});

			marker.addListener("click", () => {
				infowindow.open(map, marker);
			});
		}
	</script>
	<script th:if="${post.latitude != null and post.longitude != null}"
	        th:src="@{|https://maps.googleapis.com/maps/api/js?key=${googleApiKey}&callback=initMap|}"
	        async defer>
	</script>

	<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
