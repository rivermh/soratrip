<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- 1. 공통 Head 프래그먼트 연결 -->
<head th:replace="~{fragments/common :: head(~{::title})}">
    <title th:text="#{post.list.title} + ' - SoraTrip'">✈️ 여행 & 동행 게시판 - SoraTrip</title>
</head>

<body>

    <!-- 2. 공통 Header 프래그먼트 연결 -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- 3. 게시판 목록 메인 컨텐츠 -->
    <main class="container" style="max-width: 900px;">
        
        <!-- 상단 헤더 & 글쓰기 버튼 -->
        <div class="page-header-row">
            <div>
                <span class="eyebrow">Community & Partner</span>
                <h2 th:text="#{post.list.title}" style="margin-bottom: 0;">✈️ 여행 & 동행 게시판</h2>
            </div>
            <div class="page-actions" sec:authorize="isAuthenticated()">
                <a th:href="@{/posts/new}" class="btn btn-primary" th:text="#{post.write}">✍️ 글쓰기</a>
            </div>
        </div>

        <!-- 🔍 검색 & 필터 카드 영역 -->
        <section class="filter-panel">

            <!-- 검색창 -->
            <form th:action="@{/posts}" method="get" class="post-search-row">
                <!-- 현재 선택된 필터 파라미터 유지 -->
                <input type="hidden" name="region" th:if="${selectedRegion != null}" th:value="${selectedRegion}">
                <input type="hidden" name="category" th:if="${selectedCategory != null}" th:value="${selectedCategory}">

                <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                       th:placeholder="#{post.search.placeholder}"
                       placeholder="제목이나 내용으로 검색해 보세요..." />
                <button type="submit" class="btn btn-primary" th:text="#{post.search.btn}">검색</button>
            </form>

            <!-- 지역 필터 -->
            <div class="filter-row">
                <span class="filter-label" th:text="#{post.region}">지역:</span>
                <a th:href="@{/posts(category=${selectedCategory}, keyword=${keyword})}"
                   class="filter-chip"
                   th:classappend="${selectedRegion == null || selectedRegion == ''} ? 'active' : ''"
                   th:text="#{post.filter.all}">전체</a>
                <a th:each="r : ${regions}"
                   th:href="@{/posts(region=${r}, category=${selectedCategory}, keyword=${keyword})}"
                   th:text="${r.displayName}"
                   class="filter-chip"
                   th:classappend="${selectedRegion == r} ? 'active' : ''">지역</a>
            </div>

            <!-- 카테고리 필터 -->
            <div class="filter-row">
                <span class="filter-label" th:text="#{post.category}">분류:</span>
                <a th:href="@{/posts(region=${selectedRegion}, keyword=${keyword})}"
                   class="filter-chip"
                   th:classappend="${selectedCategory == null || selectedCategory == ''} ? 'active' : ''"
                   th:text="#{post.filter.all}">전체</a>
                <a th:each="c : ${categories}"
                   th:href="@{/posts(region=${selectedRegion}, category=${c}, keyword=${keyword})}"
                   th:text="${c.displayName}"
                   class="filter-chip"
                   th:classappend="${selectedCategory == c} ? 'active' : ''">카테고리</a>
            </div>
        </section>

        <!-- 동행 매칭 카드 목록 -->
        <div th:if="${posts.totalElements == 0}" class="empty-state" th:text="#{post.empty}">등록된 게시글이 없습니다.</div>

        <div th:unless="${posts.totalElements == 0}" class="post-grid">
            <a th:each="p : ${posts}" th:href="@{/posts/{id}(id=${p.id})}" class="post-card">
                <div class="post-card__cover">
                    <span class="post-card__cover-region" th:text="${p.region.displayName}">도쿄</span>
                    <span class="post-card__cover-category" th:text="${p.category.displayName}">동행</span>
                </div>
                <div class="post-card__body">
                    <h3 class="post-card__title" th:text="${p.title}">글 제목</h3>
                    <div class="post-card__meta">
                        <span class="post-card__writer" th:text="${p.writerNickname}">작성자</span>
                        <span class="post-card__views">👁 <span th:text="${p.viewCount}">0</span></span>
                    </div>
                </div>
            </a>
        </div>

        <!-- 📄 페이징 영역 -->
        <div th:if="${posts.totalPages > 1}" class="pagination">
            <!-- 이전 페이지 -->
            <a th:if="${posts.hasPrevious()}"
               th:href="@{/posts(page=${posts.number - 1}, region=${selectedRegion}, category=${selectedCategory}, keyword=${keyword})}"
               class="btn btn-secondary" style="width: auto; padding: 5px 12px;" th:text="#{page.prev}">이전</a>

            <!-- 페이지 번호 -->
            <a th:each="pageNumber : ${#numbers.sequence(0, posts.totalPages - 1)}"
               th:href="@{/posts(page=${pageNumber}, region=${selectedRegion}, category=${selectedCategory}, keyword=${keyword})}"
               th:text="${pageNumber + 1}"
               th:classappend="${pageNumber == posts.number} ? 'active'">1</a>

            <!-- 다음 페이지 -->
            <a th:if="${posts.hasNext()}"
               th:href="@{/posts(page=${posts.number + 1}, region=${selectedRegion}, category=${selectedCategory}, keyword=${keyword})}"
               class="btn btn-secondary" style="width: auto; padding: 5px 12px;" th:text="#{page.next}">다음</a>
        </div>

        <!-- 하단 홈 이동 버튼 -->
        <div style="margin-top: 24px; text-align: center;">
            <a th:href="@{/}" class="btn btn-secondary" style="width: auto; padding: 10px 24px; text-decoration: none;" th:text="#{nav.home}">🏠 메인으로</a>
        </div>

    </main>

    <!-- 4. 공통 Footer 프래그먼트 연결 -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
