<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- common.html 파일의 head 프래그먼트 불러오기 -->
<head th:replace="~{fragments/common :: head(~{::title})}">
    <title>실시간 여행 채팅</title>
</head>

<body>

    <!-- header.html 파일의 header 프래그먼트 불러오기 -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- 메인 콘텐츠 영역 (채팅 + 매칭) -->
    <main class="container" style="padding-top: 40px; padding-bottom: 40px; display: flex; justify-content: center;">
        <div style="width: 100%; max-width: 1200px;">
            
            <!-- 채팅 인터페이스 -->
            <div class="chat-container">
                <!-- 채팅방 목록 (왼쪽) -->
                <div class="sidebar">
                    <div class="sidebar-header">
                        <span class="connection-status" id="connectionStatus"></span>
                        실시간 채팅
                    </div>
                    <div class="chat-rooms-list" id="chatRoomsList">
                        <div class="status">채팅방이 없습니다</div>
                    </div>
                </div>

                <!-- 메인 채팅 (오른쪽) -->
                <div class="main-chat">
                    <div class="chat-header" id="chatHeader">채팅방을 선택하세요</div>
                    <div class="messages-container" id="messagesContainer">
                        <div class="status">메시지를 보내고 받으세요</div>
                    </div>
                    <div class="input-area">
                        <input 
                            type="text" 
                            id="messageInput" 
                            placeholder="메시지를 입력하세요..."
                            disabled
                        >
                        <button id="sendButton" onclick="sendMessage()" disabled>전송</button>
                    </div>
                </div>
            </div>

            <!-- 매칭 섹션 -->
            <div class="matching-section">
                <h2>관심사가 비슷한 여행자들</h2>
                <div class="users-grid" id="matchingUsers">
                    <div class="status">로딩 중...</div>
                </div>
            </div>
            
        </div>
    </main>

    <!-- footer.html 파일의 footer 프래그먼트 불러오기 -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- 스타일 정의 -->
    <style>
        .chat-container {
            width: 100%;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
            height: 600px;
        }

        .sidebar {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid #eee;
        }

        .sidebar-header {
            background: #667eea;
            color: white;
            padding: 20px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
        }

        .chat-rooms-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .chat-room-item {
            padding: 15px;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.3s;
            margin-bottom: 5px;
        }

        .chat-room-item:hover {
            background: #f8f9fa;
        }

        .chat-room-item.active {
            background: #667eea;
            color: white;
        }

        .room-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .room-preview {
            font-size: 12px;
            opacity: 0.8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .main-chat {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid #eee;
        }

        .chat-header {
            background: #667eea;
            color: white;
            padding: 20px;
            font-size: 16px;
            font-weight: bold;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: #fcfcfc;
        }

        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.own {
            align-self: flex-end;
            max-width: 70%;
        }

        .message.other {
            align-self: flex-start;
            max-width: 70%;
        }

        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message.own .message-content {
            background: #667eea;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.other .message-content {
            background: #e9ecef;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message-sender {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .message.other .message-sender { text-align: left; }
        .message.own .message-sender { text-align: right; }

        .message-time {
            font-size: 10px;
            color: #999;
            margin-top: 4px;
        }

        .message.own .message-time { text-align: right; }
        .message.other .message-time { text-align: left; }

        .input-area {
            padding: 15px 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
            background: white;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }

        .input-area input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-area button {
            background: #667eea;
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .input-area button:hover {
            background: #556cd6;
        }

        .matching-section {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            border: 1px solid #eee;
        }

        .matching-section h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #333;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .user-card {
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid #eee;
        }

        .user-card:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .user-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .user-similarity {
            font-size: 12px;
            opacity: 0.8;
        }

        .status {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }

        .connection-status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #dc3545;
            margin-right: 8px;
        }

        .connection-status.connected {
            background: #28a745;
        }

        @media (max-width: 768px) {
            .chat-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .sidebar {
                max-height: 250px;
            }
        }
    </style>

    <!-- WebSocket + STOMP 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script>
        // 전역 변수
        let stompClient = null;
        let currentChatRoomId = null;
        let currentUserId = null; // 서버에서 동적으로 가져올 로그인 유저 ID

        // ==================== 초기화 ====================
        function init() {
            // 1. 내 ID를 먼저 가져온 후 채팅방 및 매칭 목록 로드, 소켓 연결 진행
            fetch('/api/chat/my-id')
                .then(response => response.json())
                .then(userId => {
                    currentUserId = userId;
                    console.log("로그인 사용자 ID:", currentUserId);
                    
                    loadChatRooms();
                    loadMatchingUsers();
                    connectWebSocket();
                })
                .catch(error => console.error('사용자 ID 로드 실패:', error));
        }

        // ==================== WebSocket 연결 ====================
        function connectWebSocket() {
            const socket = new SockJS('/ws/chat');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, onConnected, onError);
        }

        function onConnected() {
            console.log('WebSocket 연결됨');
            updateConnectionStatus(true);
        }

        function onError(error) {
            console.error('WebSocket 에러:', error);
            updateConnectionStatus(false);
        }

        function updateConnectionStatus(connected) {
            const status = document.getElementById('connectionStatus');
            if (status) {
                if (connected) {
                    status.classList.add('connected');
                } else {
                    status.classList.remove('connected');
                }
            }
        }

        // ==================== 채팅방 관리 ====================
        function loadChatRooms() {
            fetch('/api/chat/my-rooms')
                .then(response => response.json())
                .then(rooms => {
                    const container = document.getElementById('chatRoomsList');
                    if (rooms.length === 0) {
                        container.innerHTML = '<div class="status">채팅방이 없습니다</div>';
                        return;
                    }

                    container.innerHTML = '';
                    rooms.forEach(room => {
                        const roomElement = document.createElement('div');
                        roomElement.className = 'chat-room-item';
                        if (room.id === currentChatRoomId) {
                            roomElement.classList.add('active');
                        }
                        roomElement.innerHTML = `
                            <div class="room-name">${room.otherUserNickname}</div>
                            <div class="room-preview">${room.otherUserName || ''}</div>
                        `;
                        roomElement.onclick = () => selectChatRoom(room.id, room.otherUserNickname);
                        container.appendChild(roomElement);
                    });
                })
                .catch(error => console.error('채팅방 로드 실패:', error));
        }

        function selectChatRoom(roomId, roomTitle) {
            currentChatRoomId = roomId;

            // UI 헤더 이름 변경
            document.getElementById('chatHeader').innerText = roomTitle ? `${roomTitle} 님과의 대화` : '채팅방';

            // 메시지 히스토리 로드
            loadMessages(roomId);

            // 입력창 활성화
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendButton').disabled = false;

            // WebSocket 구독
            if (stompClient && stompClient.connected) {
                stompClient.subscribe(`/topic/chat/${roomId}`, onMessageReceived);
            }
        }

        function loadMessages(roomId) {
            fetch(`/api/chat/rooms/${roomId}/messages`)
                .then(response => response.json())
                .then(messages => {
                    const container = document.getElementById('messagesContainer');
                    container.innerHTML = '';

                    if (messages.length === 0) {
                        container.innerHTML = '<div class="status">아직 메시지가 없습니다</div>';
                        return;
                    }

                    messages.forEach(msg => {
                        displayMessage(msg);
                    });

                    container.scrollTop = container.scrollHeight;
                })
                .catch(error => console.error('메시지 로드 실패:', error));
        }

        // ==================== 메시지 송수신 ====================
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();

            if (!content || !currentChatRoomId || !stompClient || !stompClient.connected) {
                return;
            }

            // STOMP로 메시지 전송
            stompClient.send(
                `/app/chat/${currentChatRoomId}`,
                {},
                JSON.stringify({ content: content })
            );

            input.value = '';
        }

        function onMessageReceived(message) {
            const msg = JSON.parse(message.body);
            displayMessage(msg);

            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        function displayMessage(msg) {
            const container = document.getElementById('messagesContainer');

            const statusElement = container.querySelector('.status');
            if (statusElement) {
                statusElement.remove();
            }

            // 내가 보낸 메시지 여부 판단 (senderId와 내 ID 비교)
            const isOwn = (msg.senderId === currentUserId);

            const messageElement = document.createElement('div');
            messageElement.className = `message ${isOwn ? 'own' : 'other'}`;

            const time = msg.sentAt ? new Date(msg.sentAt).toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit'
            }) : '';

            messageElement.innerHTML = `
                <div class="message-sender">${msg.senderName || '상대방'}</div>
                <div class="message-content">${escapeHtml(msg.content)}</div>
                <div class="message-time">${time}</div>
            `;

            container.appendChild(messageElement);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== 매칭 ====================
        function loadMatchingUsers() {
            fetch('/api/chat/matching/similar-users')
                .then(response => response.json())
                .then(users => {
                    const container = document.getElementById('matchingUsers');
                    if (users.length === 0) {
                        container.innerHTML = '<div class="status">매칭된 사용자가 없습니다</div>';
                        return;
                    }

                    container.innerHTML = '';
                    users.forEach(user => {
                        const userCard = document.createElement('div');
                        userCard.className = 'user-card';
                        userCard.innerHTML = `
                            <div class="user-name">${user.nickname}</div>
                            <div class="user-similarity">유사도: ${(user.similarity * 100).toFixed(0)}%</div>
                        `;
                        userCard.onclick = () => createChatWithUser(user.id, user.nickname);
                        container.appendChild(userCard);
                    });
                })
                .catch(error => console.error('매칭 사용자 로드 실패:', error));
        }

        function createChatWithUser(userId, nickname) {
            fetch(`/api/chat/rooms/${userId}`)
                .then(response => response.json())
                .then(chatRoomId => {
                    loadChatRooms();
                    setTimeout(() => {
                        selectChatRoom(chatRoomId, nickname);
                    }, 300);
                })
                .catch(error => console.error('채팅방 생성 실패:', error));
        }

        // ==================== 이벤트 리스너 ====================
        document.addEventListener('DOMContentLoaded', () => {
            const messageInput = document.getElementById('messageInput');
            if (messageInput) {
                messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        sendMessage();
                    }
                });
            }
            init();
        });
    </script>
</body>
</html>
