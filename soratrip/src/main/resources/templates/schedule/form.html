<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{schedule.form.title} + ' - SoraTrip'">새 여행 일정 만들기 - SoraTrip</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="container" style="max-width: 800px;">
        <h2 style="margin-bottom: 20px;" th:text="#{schedule.form.header}">🗺️ 새 여행 일정 짜기</h2>

        <form th:action="@{/schedules/new}" th:object="${scheduleForm}" method="post" id="scheduleForm">
            <div class="form-group">
                <label th:text="#{schedule.form.title_label}">일정 제목</label>
                <input type="text" th:field="*{title}" class="form-control"
                       th:placeholder="#{schedule.form.title_placeholder}"
                       placeholder="예: 3박 4일 도쿄 알찬 여행" required />
            </div>

            <div style="display: flex; gap: 16px; margin-bottom: 20px;">
                <div style="flex: 1;">
                    <label th:text="#{post.region}">여행 지역</label>
                    <select th:field="*{region}" class="form-control" required>
                        <option value="" th:text="#{schedule.form.select_region}">-- 선택 --</option>
                        <option th:each="r : ${regions}" th:value="${r}" th:text="${r.displayName}">TOKYO</option>
                    </select>
                </div>
                <div style="flex: 1;">
                    <label th:text="#{schedule.form.start_date}">시작일</label>
                    <input type="date" th:field="*{startDate}" class="form-control" required />
                </div>
                <div style="flex: 1;">
                    <label th:text="#{schedule.form.end_date}">종료일</label>
                    <input type="date" th:field="*{endDate}" class="form-control" required />
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 20px;">
                <label th:text="#{schedule.form.budget_label}">💰 여행 예산 (선택, 원화 기준)</label>
                <input type="number" th:field="*{budgetKrw}" class="form-control" min="0" step="1"
                       th:placeholder="#{schedule.form.budget_placeholder}"
                       placeholder="예: 1000000" />
            </div>

            <!-- 🏷️ 여행 스타일 및 이동 편의 태그 선택 영역 -->
            <div class="form-group" style="margin-bottom: 20px;">
                <label style="font-weight: 700; margin-bottom: var(--space-2); display: block; font-size: var(--text-sm); color: var(--text-sub);" th:text="#{schedule.form.tags_label}">🏷️ 여행 스타일 & 이동 편의 태그 (선택)</label>
                <div style="display: flex; flex-wrap: wrap; gap: 10px 16px; background: var(--surface); padding: var(--space-4) var(--space-5); border-radius: var(--radius); border: 1px solid var(--border-color);">
                    <div th:each="tag : ${T(com.rivermh.soratrip.domain.schedule.entity.ScheduleTag).values()}" style="display: flex; align-items: center; gap: 6px; font-size: var(--text-sm);">
                        <input type="checkbox" th:field="*{tags}" th:value="${tag}" th:id="${'tag_' + tag}" style="cursor: pointer; width: 16px; height: 16px; accent-color: var(--primary-color);" />
                        <label th:for="${'tag_' + tag}" th:text="${tag.displayName}" style="cursor: pointer; margin-bottom: 0; text-transform: none; color: var(--text-main);">혼자여행</label>
                    </div>
                </div>
            </div>

            <hr style="margin: 30px 0; border: none; border-top: 1px solid var(--border-color);" />

            <h4 th:text="#{schedule.form.place_search_title}">📍 방문 장소 검색 & 추가</h4>

            <!-- 일차 선택 탭: 시작일/종료일에 맞춰 자동으로 개수가 생기고, 선택된 일차에 장소가 추가된다 -->
            <div style="margin-bottom: 14px;">
                <label style="font-size: var(--text-xs); font-weight: 700; color: var(--text-sub); display: block; margin-bottom: 6px;" th:text="#{schedule.form.day_select_label}">일차 선택</label>
                <div id="dayTabs" style="display: flex; flex-wrap: wrap; gap: 8px;"></div>
            </div>

            <div style="background: var(--surface); padding: var(--space-5); border-radius: var(--radius-lg); border: 1px solid var(--border-color); margin-bottom: 20px;">
                <input id="pac-input" class="form-control" type="text"
                       th:placeholder="#{schedule.form.place_search_placeholder}"
                       placeholder="검색할 장소명을 입력하세요 (예: 도쿄 타워)" style="margin-bottom: 10px;">
                <div id="map" class="map-container" style="height: 250px; margin-bottom: 12px;"></div>

                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <input type="text" id="selectedPlaceName" class="form-control"
                           th:placeholder="#{schedule.form.place_name_placeholder}"
                           placeholder="선택된 장소명" readonly />
                    <input type="text" id="selectedPlaceAddress" class="form-control"
                           th:placeholder="#{schedule.form.place_address_placeholder}"
                           placeholder="주소" readonly />
                </div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <input type="time" id="selectedTime" class="form-control" style="width: 150px;" />
                    <select id="selectedPlaceType" class="form-control" style="width: 140px;">
                        <option value="" th:text="#{schedule.form.select_place_type}">-- 유형 (선택) --</option>
                        <option th:each="pt : ${T(com.rivermh.soratrip.domain.schedule.entity.PlaceType).values()}"
                                th:value="${pt}" th:text="${pt.emoji + ' ' + pt.displayName}">🍜 맛집</option>
                    </select>
                    <input type="text" id="selectedMemo" class="form-control"
                           th:placeholder="#{schedule.form.memo_placeholder}"
                           placeholder="메모 (예: 오픈시간 맞춰 방문)" style="flex: 1; min-width: 160px;" />
                    <button type="button" class="btn btn-primary" onclick="addPlaceToSchedule()" style="width: auto; white-space: nowrap;" th:text="#{schedule.form.add_place_btn}">➕ 장소 추가</button>
                </div>
            </div>

            <!-- 추가된 장소 리스트가 일차별로 묶여서 담길 영역 -->
            <h4 th:text="#{schedule.form.added_places_title}">📋 추가된 일정 장소</h4>
            <div id="addedItemsList" style="margin-bottom: 20px;">
                <p id="emptyMsg" style="color: var(--text-faint); font-size: var(--text-sm);" th:text="#{schedule.form.empty_places_msg}">지도를 통해 장소를 검색하고 '장소 추가' 버튼을 눌러주세요.</p>
            </div>

            <!-- 백엔드로 넘길 Hidden Inputs Container -->
            <div id="hiddenInputsContainer"></div>

            <div style="display: flex; gap: 10px; margin-top: 30px;">
                <button type="submit" class="btn btn-primary" style="flex: 1;" th:text="#{schedule.form.save_btn}">일정 저장하기</button>
                <a th:href="@{/schedules}" class="btn btn-secondary" style="width: auto; text-decoration: none;" th:text="#{btn.cancel}">취소</a>
            </div>
        </form>
    </div>

    <!-- 일정 생성 로딩 오버레이: 폼이 실제 페이지 이동으로 제출되므로, submit 시점에 보여주고
         응답이 올 때까지(=페이지가 새로 렌더링될 때까지) 그대로 화면을 덮고 있는다 (ai-form.html과 동일 패턴) -->
    <div id="scheduleLoadingOverlay" class="ai-loading-overlay" hidden>
        <div class="ai-loading-overlay__box">
            <div class="ai-loading-overlay__spinner"></div>
            <p class="ai-loading-overlay__title" th:text="#{schedule.form.loading_title}">일정 생성 중입니다...</p>
            <p class="ai-loading-overlay__hint" th:text="#{schedule.form.loading_hint}">잠시만 기다려주세요.</p>
        </div>
    </div>

    <!-- Google Maps Scripts & Dynamic Add Logic -->
    <script th:inline="javascript">
        let map, autocomplete, selectedPlace = null;
        let addedPlaces = []; // { name, address, lat, lng, time, memo, placeType, day }
        let selectedDayNumber = 1;
        const deleteLabel = /*[[#{schedule.item.delete}]]*/ '삭제';
        const emptyPlacesMsg = /*[[#{schedule.form.empty_places_msg}]]*/ "지도를 통해 장소를 검색하고 '장소 추가' 버튼을 눌러주세요.";
        const daySuffix = /*[[#{schedule.form.day_suffix}]]*/ '일차';

        function initMap() {
            const defaultLoc = { lat: 35.681236, lng: 139.767125 };
            map = new google.maps.Map(document.getElementById("map"), { zoom: 12, center: defaultLoc });

            const input = document.getElementById("pac-input");
            autocomplete = new google.maps.places.Autocomplete(input);
            autocomplete.bindTo("bounds", map);

            autocomplete.addListener("place_changed", () => {
                const place = autocomplete.getPlace();
                if (!place.geometry) return;

                map.setCenter(place.geometry.location);
                map.setZoom(15);

                selectedPlace = {
                    name: place.name,
                    address: place.formatted_address,
                    lat: place.geometry.location.lat(),
                    lng: place.geometry.location.lng()
                };

                document.getElementById("selectedPlaceName").value = place.name;
                document.getElementById("selectedPlaceAddress").value = place.formatted_address || '';
            });
        }

        // 시작일/종료일 기준으로 총 여행 일수를 계산한다 (둘 다 없으면 최소 1일차)
        function computeDaysCount() {
            const startVal = document.getElementById("startDate").value;
            const endVal = document.getElementById("endDate").value;
            if (!startVal || !endVal) return 1;

            const start = new Date(startVal);
            const end = new Date(endVal);
            const diffDays = Math.round((end - start) / (1000 * 60 * 60 * 24)) + 1;
            if (isNaN(diffDays) || diffDays < 1) return 1;
            return Math.min(diffDays, 60); // 비정상적으로 긴 값 방지
        }

        function selectDay(dayNumber) {
            selectedDayNumber = dayNumber;
            renderDayTabs();
        }

        function renderDayTabs() {
            const daysCount = computeDaysCount();
            if (selectedDayNumber > daysCount) {
                selectedDayNumber = daysCount;
            }

            const tabsDiv = document.getElementById("dayTabs");
            tabsDiv.innerHTML = '';
            for (let d = 1; d <= daysCount; d++) {
                const isActive = d === selectedDayNumber;
                const btn = document.createElement("button");
                btn.type = "button";
                btn.textContent = d + daySuffix;
                btn.className = isActive ? "btn btn-primary" : "btn btn-secondary";
                btn.style.cssText = "width: auto; padding: 6px 16px; font-size: var(--text-sm);";
                btn.onclick = () => selectDay(d);
                tabsDiv.appendChild(btn);
            }
        }

        document.getElementById("startDate").addEventListener("change", renderDayTabs);
        document.getElementById("endDate").addEventListener("change", renderDayTabs);
        renderDayTabs();

        function addPlaceToSchedule() {
            if (!selectedPlace) {
                alert(/*[[#{schedule.form.no_place_selected}]]*/ "먼저 지도 검색을 통해 장소를 선택해주세요.");
                return;
            }

            const time = document.getElementById("selectedTime").value;
            const memo = document.getElementById("selectedMemo").value;
            const placeType = document.getElementById("selectedPlaceType").value;

            const item = { ...selectedPlace, time, memo, placeType, day: selectedDayNumber };
            addedPlaces.push(item);

            renderPlaces();

            // 입력창 초기화
            document.getElementById("pac-input").value = '';
            document.getElementById("selectedPlaceName").value = '';
            document.getElementById("selectedPlaceAddress").value = '';
            document.getElementById("selectedTime").value = '';
            document.getElementById("selectedMemo").value = '';
            document.getElementById("selectedPlaceType").value = '';
            selectedPlace = null;
        }

        function renderPlaces() {
            const listDiv = document.getElementById("addedItemsList");
            const hiddenDiv = document.getElementById("hiddenInputsContainer");

            if (addedPlaces.length === 0) {
                listDiv.innerHTML = `<p id="emptyMsg" style="color: var(--text-faint); font-size: var(--text-sm);">${emptyPlacesMsg}</p>`;
                hiddenDiv.innerHTML = '';
                return;
            }

            listDiv.innerHTML = '';
            hiddenDiv.innerHTML = '';

            // 일차별로 묶어서 보여주고, 백엔드에는 days[dayIdx].items[j] 형태로 넘긴다
            const daysCount = computeDaysCount();
            for (let d = 1; d <= daysCount; d++) {
                const dayItems = addedPlaces
                    .map((p, originalIdx) => ({ ...p, originalIdx }))
                    .filter(p => p.day === d);

                if (dayItems.length === 0) continue;

                const dayHeader = document.createElement("h5");
                dayHeader.textContent = d + daySuffix;
                dayHeader.style.cssText = "margin: 14px 0 8px; font-size: var(--text-sm); color: var(--text-sub); font-weight: 700;";
                listDiv.appendChild(dayHeader);

                dayItems.forEach((p, j) => {
                    // UI Render
                    const card = document.createElement("div");
                    card.style.cssText = "background: var(--surface-elevated); border: 1.5px solid var(--border-color); padding: var(--space-3) var(--space-4); border-radius: var(--radius); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;";
                    card.innerHTML = `
                        <div>
                            <strong>${j + 1}. ${p.name}</strong> ${p.time ? `<span style="color: var(--primary-color); font-size: 13px;">(${p.time})</span>` : ''}
                            <div style="font-size: 12px; color: var(--text-sub);">${p.address} ${p.memo ? ` | 📝 ${p.memo}` : ''}</div>
                        </div>
                        <button type="button" class="btn btn-secondary" style="padding: 4px 8px; font-size: 12px;" onclick="removePlace(${p.originalIdx})">${deleteLabel}</button>
                    `;
                    listDiv.appendChild(card);

                    // Spring Form Binding 용 Hidden Inputs (days[dayIdx].items[j] 기준, dayIdx = d - 1)
                    hiddenDiv.innerHTML += `
                        <input type="hidden" name="days[${d - 1}].items[${j}].placeName" value="${p.name}" />
                        <input type="hidden" name="days[${d - 1}].items[${j}].placeAddress" value="${p.address}" />
                        <input type="hidden" name="days[${d - 1}].items[${j}].latitude" value="${p.lat}" />
                        <input type="hidden" name="days[${d - 1}].items[${j}].longitude" value="${p.lng}" />
                        <input type="hidden" name="days[${d - 1}].items[${j}].visitTime" value="${p.time}" />
                        <input type="hidden" name="days[${d - 1}].items[${j}].memo" value="${p.memo}" />
                        ${p.placeType ? `<input type="hidden" name="days[${d - 1}].items[${j}].placeType" value="${p.placeType}" />` : ''}
                    `;
                });
            }
        }

        function removePlace(originalIdx) {
            addedPlaces.splice(originalIdx, 1);
            renderPlaces();
        }

        // HTML5 required 검증을 통과한 뒤에만 submit 이벤트가 발생하므로,
        // 여기 도달했다는 건 이미 유효한 제출이라는 뜻 -> 바로 오버레이를 띄운다 (ai-form.html과 동일 패턴)
        document.getElementById('scheduleForm').addEventListener('submit', function () {
            document.getElementById('scheduleLoadingOverlay').hidden = false;
            const submitBtn = document.querySelector('#scheduleForm button[type="submit"]');
            if (submitBtn) submitBtn.disabled = true;
        });
    </script>
<script th:src="@{'https://maps.googleapis.com/maps/api/js?key=' + ${googleApiKey} + '&libraries=places&callback=initMap'}" async defer></script>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
