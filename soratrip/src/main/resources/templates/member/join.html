<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- 1. 공통 Head 프래그먼트 연결 -->
<head th:replace="~{fragments/common :: head(~{::title})}">
    <title th:text="#{member.join.title}">📝 회원가입 - SoraTrip</title>
</head>

<body>

    <!-- 2. 공통 Header 프래그먼트 연결 -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- 3. 회원가입 중앙 폼 컨테이너 -->
    <main class="container form-container">
        
        <!-- 상단 헤딩 & 브랜드 포인트 -->
        <div class="form-header">
            <span class="eyebrow">Join SoraTrip</span>
            <h2 th:text="#{member.join.title}">📝 회원가입</h2>
        </div>

        <!-- 회원가입 폼 -->
        <form th:action="@{/members/join}" method="post">
            <div class="form-group">
                <label th:text="#{member.email}">이메일</label>
                <input type="email" name="email" class="form-control" required
                       placeholder="example@soratrip.com" />
            </div>

            <div class="form-group">
                <label th:text="#{member.password}">비밀번호</label>
                <input type="password" name="password" class="form-control" required 
                       th:placeholder="#{member.password.placeholder}"
                       placeholder="비밀번호를 입력하세요" />
            </div>

            <div class="form-group">
                <label th:text="#{member.nickname}">닉네임</label>
                <input type="text" name="nickname" class="form-control" required 
                       th:placeholder="#{member.nickname.placeholder}"
                       placeholder="사용할 닉네임을 입력하세요" />
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{btn.join}">가입하기</button>
        </form>

        <!-- 하단 로그인 안내 링크 -->
        <div class="form-footer">
            <span th:text="#{member.has_account}">이미 계정이 있으신가요?</span>
            <a th:href="@{/members/login}" th:text="#{nav.login}">로그인</a>
        </div>

    </main>

    <!-- 4. 공통 Footer 프래그먼트 연결 -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
