server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  # 외부 보안 파일 임포트 (Google Client Secret, DB Password 등)
  config:
    import: optional:classpath:application-secret.yml

  # 1. DB 설정 (MySQL)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/soratrip?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: sora_user

  # 2. JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        default_batch_fetch_size: 100
    generate-ddl: true

  # 3. Thymeleaf 템플릿 설정
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false # 개발 시 캐시 끔 (HTML 수정 즉시 반영)

  # 4. OAuth2 기본 설정
  security:
    oauth2:
      client:
        registration:
          google:
            scope:
              - profile
              - email

  # 5. 사진 업로드 (Multipart) 설정
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 15MB

# 6. 사진 업로드 저장 경로 (file.upload-dir)
file:
  upload-dir: uploads

# 7. 로그 출력 설정
logging:
  level:
    com.rivermh.soratrip: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG