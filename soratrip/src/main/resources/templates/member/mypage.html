<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{member.mypage.title} + ' - SoraTrip'">👤 마이페이지</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container" style="max-width: 800px;">
        <h2 th:text="#{member.mypage.title}" style="margin-bottom: 20px;">👤 마이페이지</h2>

        <!-- 저장 성공 알림 -->
        <div th:if="${param.success}" style="background-color: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 12px 15px; border-radius: 6px; font-size: 14px; margin-bottom: 20px;">
            ✅ 프로필이 성공적으로 수정되었습니다!
        </div>

        <!-- 1. 프로필 정보 수정 -->
        <div style="background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 30px;">
            <h3 style="margin-bottom: 15px; font-size: 18px;">✏️ 내 정보 수정</h3>
            <form th:action="@{/members/mypage}" th:object="${profile}" method="post">
                <div class="form-group">
                    <label th:text="#{member.email}">이메일</label>
                    <input type="email" th:field="*{email}" class="form-control" readonly style="background-color: #e2e8f0; cursor: not-allowed;" />
                </div>
                <div class="form-group">
                    <label th:text="#{member.nickname}">닉네임</label>
                    <input type="text" th:field="*{nickname}" class="form-control" required />
                </div>
                <div class="form-group">
                    <label th:text="#{member.language_level}">언어 수준 (JLPT / 한국어 등)</label>
                    <input type="text" th:field="*{languageLevel}" class="form-control" placeholder="예: JLPT N2 / 한국어 모국어" />
                </div>
                <div class="form-group">
                    <label th:text="#{member.bio}">자기소개</label>
                    <textarea th:field="*{bio}" class="form-control" rows="3" placeholder="자기소개를 입력해 주세요..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: auto;" th:text="#{member.save}">프로필 저장</button>
            </form>
        </div>

        <!-- 1-1. 여행 취향 태그 (추천 기능용) -->
        <div style="background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 30px;">
            <h3 style="margin-bottom: 15px; font-size: 18px;" th:text="#{member.preferred_tags.label}">✨ 여행 취향 태그</h3>
            <form th:action="@{/members/mypage/tags}" method="post">
                <div style="margin-bottom: 15px;">
                    <label th:each="t : ${tags}" style="display: inline-block; margin-right: 12px; font-weight: normal;">
                        <input type="checkbox" name="preferredTags" th:value="${t}" th:checked="${preferredTags.contains(t)}">
                        <span th:text="${t.displayName}">태그</span>
                    </label>
                </div>
                <button type="submit" class="btn btn-secondary" style="width: auto;" th:text="#{member.preferred_tags.save}">취향 저장</button>
            </form>
        </div>

        <!-- 1-2. 완료된 여행 (여행 일지) -->
        <div style="margin-bottom: 30px;">
            <h3 style="margin-bottom: 15px; font-size: 18px;" th:text="#{portfolio.completed_trips} + ' (' + ${#lists.size(completedTrips)} + ')'">🖼️ 완료된 여행 (0)</h3>
            <div th:if="${#lists.isEmpty(completedTrips)}" style="text-align: center; color: var(--text-sub); padding: 20px; background: #f8fafc; border-radius: 8px;" th:text="#{portfolio.empty}">
                아직 완료된 여행이 없습니다.
            </div>
            <table th:unless="${#lists.isEmpty(completedTrips)}" class="styled-table">
                <thead>
                    <tr>
                        <th style="width: 15%;" th:text="#{post.region}">지역</th>
                        <th th:text="#{post.title}">제목</th>
                        <th style="width: 25%;">기간</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="trip : ${completedTrips}">
                        <td><span class="badge" th:text="${trip.region.displayName}">도쿄</span></td>
                        <td>
                            <a th:href="@{/schedules/{id}/journal(id=${trip.id})}" th:text="${trip.title}" style="color: var(--text-main); font-weight: 600; text-decoration: none;">3박 4일 도쿄 여행</a>
                        </td>
                        <td th:text="${trip.startDate} + ' ~ ' + ${trip.endDate}">2026-08-01 ~ 2026-08-04</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 2. 내가 작성한 게시글 목록 -->
        <div style="margin-bottom: 30px;">
            <h3 style="margin-bottom: 15px; font-size: 18px;">📝 내가 작성한 글 (<span th:text="${#lists.size(myPosts)}">0</span>)</h3>
            <table class="styled-table">
                <thead>
                    <tr>
                        <th style="width: 15%;" th:text="#{post.region}">지역</th>
                        <th th:text="#{post.title}">제목</th>
                        <th style="width: 20%;">작성일</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${myPosts}">
                        <td><span class="badge" th:text="${p.region.displayName}">도쿄</span></td>
                        <td>
                            <a th:href="@{/posts/{id}(id=${p.id})}" th:text="${p.title}" style="color: var(--text-main); font-weight: 600; text-decoration: none;">글 제목</a>
                        </td>
                        <td th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd')}">2026-07-23</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(myPosts)}">
                        <td colspan="3" style="text-align: center; color: var(--text-sub); padding: 20px;">작성한 게시글이 없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- 3. 내가 작성한 댓글 목록 -->
        <div>
            <h3 style="margin-bottom: 15px; font-size: 18px;">💬 내가 작성한 댓글 (<span th:text="${#lists.size(myComments)}">0</span>)</h3>
            <table class="styled-table">
                <thead>
                    <tr>
                        <th th:text="#{post.content}">내용</th>
                        <th style="width: 20%;">작성일</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${myComments}">
                        <td>
                            <a th:href="@{/posts/{id}(id=${c.post.id})}" th:text="${c.content}" style="color: var(--text-main); text-decoration: none;">댓글 내용</a>
                        </td>
                        <td th:text="${#temporals.format(c.createdAt, 'yyyy-MM-dd')}">2026-07-23</td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(myComments)}">
                        <td colspan="2" style="text-align: center; color: var(--text-sub); padding: 20px;">작성한 댓글이 없습니다.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div style="margin-top: 30px;">
            <a href="/" class="btn btn-secondary" style="width: auto; text-decoration: none;" th:text="#{nav.home}">🏠 메인으로</a>
        </div>
    </div>
</body>
</html>
