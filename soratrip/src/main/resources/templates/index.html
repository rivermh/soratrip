<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="#{site.title}">SoraTrip - 한일 여행 & 동행</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <!-- 1. 네비게이션 바 -->
    <header class="navbar">
        <a th:href="@{/}" class="logo">✈️ SoraTrip</a>

        <nav style="display: flex; align-items: center; gap: 12px;">
            <!-- 로그인 상태일 때 메뉴 -->
            <div sec:authorize="isAuthenticated()" style="display: flex; align-items: center; gap: 8px;">
                <a th:href="@{/schedules}" class="btn btn-secondary" th:text="#{nav.schedule}">🗓️ 내 일정</a>
                <a th:href="@{/posts}" class="btn btn-secondary" th:text="#{post.list.title}">✈️ 여행 & 동행 게시판</a>
                <a th:href="@{/members/mypage}" class="btn btn-secondary" th:text="#{nav.mypage}">마이페이지</a>
                <form th:action="@{/members/logout}" method="post" style="display: inline;">
                    <button type="submit" class="btn btn-secondary" th:text="#{nav.logout}">로그아웃</button>
                </form>
            </div>

            <!-- 비로그인 상태일 때 메뉴 -->
            <div sec:authorize="isAnonymous()" style="display: flex; gap: 8px;">
                <a th:href="@{/members/login}" class="btn btn-primary" th:text="#{nav.login}">로그인</a>
                <a th:href="@{/members/join}" class="btn btn-secondary" th:text="#{nav.join}">회원가입</a>
            </div>

            <span style="color: var(--border-color);">|</span>

            <!-- 언어 변경 -->
            <div style="display: flex; gap: 8px; font-size: 13px;">
                <a th:href="@{''(lang='ko')}" th:text="#{lang.ko}">한국어</a>
                <a th:href="@{''(lang='ja')}" th:text="#{lang.ja}">日本語</a>
            </div>
        </nav>
    </header>

    <!-- 2. 메인 히어로 컨테이너 영역 -->
    <main class="container hero" style="text-align: center;">
        <span class="eyebrow">Sky Blue Journey</span>

        <h1 th:text="#{welcome.message}">✈️ SoraTrip에 오신 것을 환영합니다!</h1>
        <p th:text="#{sub.message}" style="margin-bottom: 24px;">한국과 일본을 잇는 자유로운 여행 & 동행 플랫폼</p>

        <!-- 환영 문구 (로그인 유저용) -->
        <div sec:authorize="isAuthenticated()" style="margin-bottom: 24px;">
            <span class="badge" th:text="#{nav.welcome(${#authentication.name})}">OO님 환영합니다!</span>
        </div>

        <div style="display: flex; justify-content: center; gap: 12px; flex-wrap: wrap;">
            <a th:href="@{/schedules}" class="btn btn-primary" th:text="#{nav.schedule}">🗓️ 내 일정</a>
            <a th:href="@{/posts}" class="btn btn-secondary" th:text="#{main.board_btn}">✈️ 여행 & 동행 게시판 보러가기</a>
        </div>
    </main>

</body>
</html>
