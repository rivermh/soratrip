<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{schedule.settings.title} + ' - SoraTrip'">⚙️ 일정 공개 설정 - SoraTrip</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="container form-container" style="max-width: 480px;">
        <div class="form-header">
            <span class="eyebrow">Schedule Settings</span>
            <h2 th:text="#{schedule.settings.title}">⚙️ 일정 공개 설정</h2>
        </div>
        <p style="color: var(--text-sub); text-align: center; margin-bottom: var(--space-6); font-size: var(--text-sm);" th:text="${schedule.title}">3박 4일 도쿄 여행</p>

        <form th:action="@{/schedules/{id}/settings(id=${schedule.id})}" method="post">
            <div class="form-group">
                <label style="display: flex; align-items: center; gap: 8px; text-transform: none; font-size: var(--text-sm); color: var(--text-main); cursor: pointer;">
                    <input type="checkbox" name="isPublic" value="true" th:checked="${schedule.public}" style="width: 18px; height: 18px; accent-color: var(--primary-color); flex-shrink: 0;">
                    <span th:text="#{schedule.settings.public}">이 일정을 공개하여 다른 사람이 둘러보고 복사할 수 있도록 허용</span>
                </label>
            </div>

            <div class="form-group">
                <label th:text="#{schedule.form.budget_label}">💰 여행 예산 (선택, 원화 기준)</label>
                <input type="number" name="budgetKrw" class="form-control" min="0" step="1"
                       th:value="${schedule.budgetKrw != null ? schedule.budgetKrw.longValue() : ''}"
                       th:placeholder="#{schedule.form.budget_placeholder}"
                       placeholder="예: 1000000" />
            </div>

            <div class="form-group">
                <label th:text="#{schedule.tags.label}">태그</label>
                <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                    <label th:each="t : ${tags}" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius-full); background: var(--surface); border: 1px solid var(--border-color); font-size: var(--text-xs); font-weight: 600; color: var(--text-sub); text-transform: none; cursor: pointer;">
                        <input type="checkbox" name="tags" th:value="${t}" th:checked="${schedule.tags.contains(t)}" style="accent-color: var(--primary-color);">
                        <span th:text="${t.displayName}">태그</span>
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{btn.save}">등록</button>
        </form>

        <div class="form-group" style="margin-top: var(--space-6); padding-top: var(--space-5); border-top: 1px solid var(--border-color);">
            <label th:text="#{schedule.share.label}">🔗 로그인 없이 보는 공유 링크</label>

            <div th:if="${schedule.shareToken == null}">
                <p style="color: var(--text-sub); font-size: var(--text-sm); margin-bottom: var(--space-3);" th:text="#{schedule.share.description}">
                    링크가 있으면 로그인 없이도 이 일정을 볼 수 있어요. (수정 불가)
                </p>
                <form th:action="@{/schedules/{id}/share(id=${schedule.id})}" method="post">
                    <button type="submit" class="btn btn-secondary" th:text="#{schedule.share.create}">공유 링크 만들기</button>
                </form>
            </div>

            <div th:if="${schedule.shareToken != null}">
                <div style="display: flex; gap: 8px; margin-bottom: var(--space-3);">
                    <input id="shareLinkInput" type="text" class="form-control" readonly
                           th:value="@{/shared/{token}(token=${schedule.shareToken})}">
                    <button type="button" class="btn btn-secondary" style="width: auto;" onclick="copyShareLink()" th:text="#{schedule.share.copy}">복사</button>
                </div>
                <form th:action="@{/schedules/{id}/share/revoke(id=${schedule.id})}" method="post"
                      onsubmit="return confirm(/*[[#{schedule.share.revoke_confirm}]]*/ '공유 링크를 삭제할까요? 기존 링크는 더 이상 열리지 않아요.');">
                    <button type="submit" class="btn btn-secondary btn-danger-ghost" th:text="#{schedule.share.revoke}">공유 링크 삭제</button>
                </form>
            </div>
        </div>

        <div class="form-footer">
            <a th:href="@{/schedules/{id}(id=${schedule.id})}" th:text="#{btn.cancel}">취소</a>
        </div>
    </div>

    <script th:inline="javascript">
        function copyShareLink() {
            const input = document.getElementById('shareLinkInput');
            if (!input) return;
            const fullUrl = window.location.origin + input.value;
            navigator.clipboard.writeText(fullUrl)
                .then(() => alert(/*[[#{schedule.share.copied}]]*/ '링크가 복사되었습니다.'))
                .catch(() => { input.value = fullUrl; input.select(); });
        }
    </script>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
