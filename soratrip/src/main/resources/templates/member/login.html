<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- 1. 공통 Head 프래그먼트 연결 -->
<head th:replace="~{fragments/common :: head(~{::title})}">
    <title th:text="#{member.login} + ' - SoraTrip'">로그인 - SoraTrip</title>
</head>

<body>

    <!-- 2. 공통 Header 프래그먼트 연결 -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- 3. 로그인 중앙 폼 컨테이너 -->
    <main class="container form-container">
        
        <!-- 상단 헤딩 & 브랜드 포인트 -->
        <div class="form-header">
            <span class="eyebrow">Welcome Back</span>
            <h2><span th:text="#{member.login.title}">🔑 로그인</span></h2>
        </div>

        <!-- ⚠️ 로그인 실패 시 에러 알림 -->
        <div th:if="${param.error}" class="alert alert-error">
            <span>⚠️</span>
            <span th:text="#{member.login_error}">아이디 또는 비밀번호가 일치하지 않습니다.</span>
        </div>

        <!-- 🔒 로그인 5회 실패로 계정이 잠긴 경우 -->
        <div th:if="${param.locked}" class="alert alert-error">
            <span>🔒</span>
            <span th:text="#{member.login.locked}">로그인 5회 실패로 계정이 일시적으로 잠겼습니다. 30분 후 다시 시도해 주세요.</span>
        </div>

        <!-- ✅ 비밀번호 재설정 성공 알림 -->
        <div th:if="${param.reset}" class="alert alert-success">
            <span>✨</span>
            <span th:text="#{member.login.reset_success}">비밀번호가 재설정되었습니다. 새 비밀번호로 로그인해 주세요.</span>
        </div>

        <!-- ✅ 마이페이지 비밀번호 변경 성공 알림 -->
        <div th:if="${param.passwordChanged}" class="alert alert-success">
            <span>✨</span>
            <span th:text="#{member.mypage.password.success}">비밀번호가 성공적으로 변경되었습니다!</span>
        </div>

        <!-- ℹ️ 로그아웃 성공 알림 -->
        <div th:if="${param.logout}" class="alert alert-success">
            <span>✨</span>
            <span th:text="#{member.logout_success}">성공적으로 로그아웃되었습니다.</span>
        </div>

        <!-- 로그인 폼 -->
        <form th:action="@{/members/login}" method="post">
            <div class="form-group">
                <label th:text="#{member.email}">이메일</label>
                <input type="email" name="email" class="form-control" required placeholder="example@soratrip.com" />
            </div>

            <div class="form-group">
                <label th:text="#{member.password}">비밀번호</label>
                <input type="password" name="password" class="form-control" required
                       th:placeholder="#{member.password.placeholder}"
                       placeholder="비밀번호를 입력하세요" />
                <a th:href="@{/members/password-reset}" class="hint-text" style="display: inline-block; margin-top: 6px;" th:text="#{member.login.forgot_password}">비밀번호를 잊으셨나요?</a>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{member.login}">로그인</button>
        </form>

        <!-- 구글 소셜 로그인 버튼 -->
        <div class="social-login-group">
            <a th:href="@{/oauth2/authorization/google}" class="btn btn-secondary">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span th:text="#{member.login.google}">Google 계정으로 로그인</span>
            </a>
        </div>

        <!-- 하단 회원가입 안내 링크 -->
        <div class="form-footer">
            <span th:text="#{member.no_account}">아직 계정이 없으신가요?</span> 
            <a th:href="@{/members/join}" th:text="#{member.join}">회원가입</a>
        </div>

    </main>

    <!-- 4. 공통 Footer 프래그먼트 연결 -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
