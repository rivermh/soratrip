<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title th:text="(${editMode} != null and ${editMode} ? #{post.edit} : #{post.write}) + ' - SoraTrip'">✍️ 글쓰기 - SoraTrip</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<header th:replace="~{fragments/header :: header}"></header>

	<div class="container" style="max-width: 800px;">
		<span class="eyebrow">Community</span>
		<h2 th:text="${editMode} != null and ${editMode} ? #{post.edit} : #{post.write}" style="margin-bottom: 24px;">✍️ 게시글 작성</h2>

		<form th:action="${editMode} != null and ${editMode} ? @{/posts/{id}/edit(id=${postId})} : @{/posts/new}" th:object="${postForm}" method="post">
			
			<!-- 지역 선택 -->
			<div class="form-group">
				<label th:text="#{post.region}">지역</label>
				<select th:field="*{region}" class="form-control" required>
					<option value="" th:text="#{post.select.region}">-- 지역 선택 --</option>
					<option th:each="r : ${regions}" th:value="${r}" th:text="${r.displayName}">도쿄</option>
				</select>
			</div>

			<!-- 카테고리 선택 -->
			<div class="form-group">
				<label th:text="#{post.category}">카테고리</label>
				<select th:field="*{category}" class="form-control" required>
					<option value="" th:text="#{post.select.category}">-- 카테고리 선택 --</option>
					<option th:each="c : ${categories}" th:value="${c}" th:text="${c.displayName}">동행</option>
				</select>
			</div>

			<!-- 제목 -->
			<div class="form-group">
				<label th:text="#{post.title}">제목</label>
				<input type="text" th:field="*{title}" class="form-control" 
				       th:placeholder="#{post.title.placeholder}"
				       placeholder="제목을 입력하세요" required />
			</div>

			<!-- 📍 위치 선택 영역 (Google Maps) -->
			<div class="form-group" style="background: var(--surface); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border-light); margin-bottom: 22px;">
				<label style="font-weight: 700; color: var(--text-main); margin-bottom: 12px; display: block;" th:text="#{post.place.label}">📍 약속 / 추천 장소 선택 (선택사항)</label>

				<!-- 검색창 -->
				<input id="pac-input" class="form-control" type="text" 
				       th:placeholder="#{post.place.search.placeholder}"
				       placeholder="장소를 검색하세요 (예: 도쿄 타워, 오사카역)" style="margin-bottom: 12px; background-color: #ffffff;">

				<!-- 지도 표시 영역 -->
				<div id="map" style="width: 100%; height: 320px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 12px;"></div>

				<!-- 선택된 장소 정보 표시 및 hidden input -->
				<div style="display: flex; gap: 10px;">
					<input type="text" id="placeName" th:field="*{placeName}" class="form-control" 
					       th:placeholder="#{post.place.name.placeholder}"
					       placeholder="장소명" readonly style="background: #ffffff;" />
					<input type="text" id="placeAddress" th:field="*{placeAddress}" class="form-control" 
					       th:placeholder="#{post.place.address.placeholder}"
					       placeholder="주소" readonly style="background: #ffffff;" />
				</div>

				<!-- 폼 전송용 위도/경도 hidden 필드 -->
				<input type="hidden" id="latitude" th:field="*{latitude}" />
				<input type="hidden" id="longitude" th:field="*{longitude}" />
			</div>

			<!-- 내용 -->
			<div class="form-group">
				<label th:text="#{post.content}">내용</label>
				<textarea th:field="*{content}" class="form-control" rows="8" 
				          th:placeholder="#{post.content.placeholder}"
				          placeholder="내용을 입력하세요" required></textarea>
			</div>

			<!-- 내 여행 일정 선택 -->
			<div class="form-group">
				<label th:text="#{post.schedule.select}">🗓️ 내 여행 일정 선택 (선택사항)</label>
				<select name="travelScheduleId" class="form-control">
					<option value="" th:text="#{post.schedule.none}">-- 일정 선택 안함 --</option>
					<option th:each="s : ${mySchedules}" th:value="${s.id}" th:text="${s.title} + ' (' + ${s.startDate} + ' ~ ' + ${s.endDate} + ')'">도쿄 3박 4일 일정</option>
				</select>
			</div>

			<!-- 버튼 영역 -->
			<div style="display: flex; gap: 12px; margin-top: 28px;">
				<button type="submit" class="btn btn-primary" style="flex: 1;" th:text="#{btn.save}">등록</button>
				<a th:href="${editMode} != null and ${editMode} ? @{/posts/{id}(id=${postId})} : @{/posts}" class="btn btn-secondary" style="width: auto; text-decoration: none;" th:text="#{btn.cancel}">취소</a>
			</div>
			
		</form>
	</div>

	<!-- 🗺️ Google Maps JavaScript API (Places 라이브러리 포함) -->
	<script th:inline="javascript">
        let map, marker, geocoder, autocomplete;

        function initMap() {
            // 기본 중심 좌표 (도쿄역)
            const defaultLoc = { lat: 35.681236, lng: 139.767125 };

            map = new google.maps.Map(document.getElementById("map"), {
                zoom: 13,
                center: defaultLoc,
            });

            geocoder = new google.maps.Geocoder();

            // 수정 모드: 기존에 선택된 장소가 있으면 지도에 마커 미리 표시
            const existingLat = document.getElementById("latitude").value;
            const existingLng = document.getElementById("longitude").value;
            if (existingLat && existingLng) {
                const existingLoc = { lat: parseFloat(existingLat), lng: parseFloat(existingLng) };
                map.setCenter(existingLoc);
                map.setZoom(16);
                marker = new google.maps.Marker({ position: existingLoc, map: map });
            }

            // 검색창 Autocomplete 연동
            const input = document.getElementById("pac-input");
            autocomplete = new google.maps.places.Autocomplete(input);
            autocomplete.bindTo("bounds", map);

            autocomplete.addListener("place_changed", () => {
                const place = autocomplete.getPlace();
                if (!place.geometry || !place.geometry.location) return;

                if (place.geometry.viewport) {
                    map.fitBounds(place.geometry.viewport);
                } else {
                    map.setCenter(place.geometry.location);
                    map.setZoom(17);
                }

                setMarker(place.geometry.location, place.name, place.formatted_address);
            });

            // 지도 클릭 시 핀 이동 및 주소 가져오기
            map.addListener("click", (e) => {
                geocoder.geocode({ location: e.latLng }, (results, status) => {
                    if (status === "OK" && results[0]) {
                        const placeName = results[0].address_components[0].long_name;
                        const address = results[0].formatted_address;
                        setMarker(e.latLng, placeName, address);
                    }
                });
            });
        }

        function setMarker(location, name, address) {
            if (marker) marker.setMap(null);

            marker = new google.maps.Marker({
                position: location,
                map: map,
            });

            document.getElementById("latitude").value = location.lat();
            document.getElementById("longitude").value = location.lng();
            document.getElementById("placeName").value = name || /*[[#{post.place.default_name}]]*/ "선택한 장소";
            document.getElementById("placeAddress").value = address || "";
        }
    </script>
<script th:src="@{|https://maps.googleapis.com/maps/api/js?key=${googleApiKey}&libraries=places&callback=initMap|}" async defer></script>

	<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
