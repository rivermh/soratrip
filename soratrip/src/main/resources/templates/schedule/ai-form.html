<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{schedule.ai.page_title}">AI 맞춤 일정 생성 - SoraTrip</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="container form-container" style="max-width: 650px;">
        <span class="eyebrow">AI Planner</span>
        <h2 style="margin-bottom: var(--space-2);" th:text="#{schedule.ai.title}">AI 여행 일정 자동 생성</h2>
        <p style="color: var(--text-sub); font-size: var(--text-sm); margin-bottom: var(--space-2);" th:text="#{schedule.ai.description}">
            조건을 입력하면 AI가 지도 동선까지 연결된 일정을 자동으로 만들어 드려요.
        </p>
        <p style="color: var(--text-sub); font-size: var(--text-xs); margin-bottom: var(--space-6);" th:text="#{schedule.ai.disclaimer}">
            🤖 AI가 만든 추천이에요. 방문 전 정보를 다시 확인해주세요.
        </p>

        <form id="aiScheduleForm" th:action="@{/schedules/ai-new}" th:object="${aiRequest}" method="post" style="display: grid; gap: var(--space-5);">
            <div class="form-group" style="margin-bottom: 0;">
                <label th:text="#{schedule.ai.region_label}">📍 여행 지역</label>
                <select th:field="*{region}" class="form-control" required>
                    <option th:each="r : ${regions}" th:value="${r}" th:text="${r.displayName}">지역 선택</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label th:text="#{schedule.form.start_date}">시작일</label>
                <input type="date" th:field="*{startDate}" class="form-control" required>
                <div class="error-message" th:if="${#fields.hasErrors('startDate')}">
                    <span th:errors="*{startDate}"></span>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label th:text="#{schedule.ai.days_label}">📅 여행 기간 (일수)</label>
                <input type="number" th:field="*{daysCount}" min="1" max="7" value="3" class="form-control" required
                       th:placeholder="#{schedule.ai.days_placeholder}" placeholder="예: 3 (3일차)">
                <small class="hint-text" th:text="#{schedule.ai.days_hint}">최대 7일까지 설정할 수 있어요.</small>
                <div class="error-message" th:if="${#fields.hasErrors('daysCount')}">
                    <span th:errors="*{daysCount}"></span>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label th:text="#{schedule.ai.companion_label}">👥 동행자 타입</label>
                <input type="text" th:field="*{companionType}" class="form-control"
                       th:placeholder="#{schedule.ai.companion_placeholder}" placeholder="예: 부모님 모시고, 혼자 여행, 아이 동반 등">
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label th:text="#{schedule.ai.tags_label}">🧳 이동 스타일 및 취향 태그</label>
                <div style="display: flex; flex-wrap: wrap; gap: 8px; background: var(--surface); padding: var(--space-4); border-radius: var(--radius); border: 1px solid var(--border-color);">
                    <label th:each="t : ${tags}" style="font-size: var(--text-xs); font-weight: 600; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; padding: 6px 12px; border-radius: var(--radius-full); background: var(--surface-elevated); border: 1px solid var(--border-color); text-transform: none;">
                        <input type="checkbox" th:field="*{tags}" th:value="${t}" style="accent-color: var(--primary-color);">
                        <span th:text="${t.displayName}">태그</span>
                    </label>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label th:text="#{schedule.ai.extra_label}">📝 추가 요청사항 (필수)</label>
                <textarea th:field="*{extraPrompt}" class="form-control" rows="3" required minlength="10" maxlength="300"
                          th:placeholder="#{schedule.ai.extra_placeholder}" placeholder="예: 계단이 많은 곳은 피해주세요, 하루 1.5만보 이하로 걷고 싶어요, 대형 캐리어 보관 가능한 곳 위주로 짜주세요."></textarea>
                <small class="hint-text" th:text="#{schedule.ai.extra_hint}">구체적으로 적을수록 로컬 맛집 위주로 잘 나와요. (예: "체인점 말고 노포 위주로")</small>
                <div class="error-message" th:if="${#fields.hasErrors('extraPrompt')}">
                    <span th:errors="*{extraPrompt}"></span>
                </div>
            </div>

            <button type="submit" id="aiSubmitBtn" class="btn btn-ai" style="font-size: var(--text-base); padding: 14px;" th:text="#{schedule.ai.submit_btn}">AI 일정 생성 시작하기</button>
        </form>
    </div>

    <!-- AI 일정 생성 로딩 오버레이: 폼이 실제 페이지 이동으로 제출되므로, submit 시점에 보여주고
         응답이 올 때까지(=페이지가 새로 렌더링될 때까지) 그대로 화면을 덮고 있는다 -->
    <div id="aiLoadingOverlay" class="ai-loading-overlay" hidden>
        <div class="ai-loading-overlay__box">
            <div class="ai-loading-overlay__spinner"></div>
            <p class="ai-loading-overlay__title" th:text="#{schedule.ai.loading_title}">AI가 열심히 일정을 생성하고 있어요...</p>
            <p class="ai-loading-overlay__hint" th:text="#{schedule.ai.loading_hint}">최대 1분 정도 걸릴 수 있어요. 이 화면을 벗어나지 말고 잠시만 기다려주세요.</p>
        </div>
    </div>

    <script th:inline="javascript">
        document.getElementById('aiScheduleForm').addEventListener('submit', function () {
            // HTML5 required/minlength 검증을 통과한 뒤에만 submit 이벤트가 발생하므로,
            // 여기 도달했다는 건 이미 유효한 제출이라는 뜻 -> 바로 오버레이를 띄운다
            document.getElementById('aiLoadingOverlay').hidden = false;
            const btn = document.getElementById('aiSubmitBtn');
            if (btn) btn.disabled = true;
        });
    </script>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
