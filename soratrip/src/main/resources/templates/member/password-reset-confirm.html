<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- 1. 공통 Head 프래그먼트 연결 -->
<head th:replace="~{fragments/common :: head(~{::title})}">
    <title th:text="#{member.password_reset.confirm_title} + ' - SoraTrip'">🔑 새 비밀번호 설정 - SoraTrip</title>
</head>

<body>

    <!-- 2. 공통 Header 프래그먼트 연결 -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- 3. 비밀번호 재설정 확정 폼 -->
    <main class="container form-container">

        <div class="form-header">
            <span class="eyebrow">Reset Password</span>
            <h2 th:text="#{member.password_reset.confirm_title}">🔑 새 비밀번호 설정</h2>
        </div>

        <form th:action="@{/members/password-reset/confirm}" th:object="${passwordResetConfirmDto}" method="post" novalidate>
            <input type="hidden" th:field="*{email}" />

            <div class="form-group" th:classappend="${#fields.hasErrors('code') ? 'has-error' : ''}">
                <label for="code" th:text="#{member.password_reset.code_label}">인증 코드</label>
                <input type="text" id="code" th:field="*{code}" class="form-control" maxlength="6"
                       th:placeholder="#{member.password_reset.code_placeholder}" placeholder="이메일로 받은 6자리 코드" required />

                <div class="error-message" th:if="${#fields.hasErrors('code')}">
                    <span th:errors="*{code}"></span>
                </div>
            </div>

            <div class="form-group" th:classappend="${#fields.hasErrors('newPassword') ? 'has-error' : ''}">
                <label for="newPassword" th:text="#{member.password_reset.new_password}">새 비밀번호</label>
                <input type="password" id="newPassword" th:field="*{newPassword}" class="form-control"
                       th:placeholder="#{member.password.placeholder}" placeholder="비밀번호를 입력하세요" required />

                <div class="error-message" th:if="${#fields.hasErrors('newPassword')}">
                    <span th:errors="*{newPassword}"></span>
                </div>
            </div>

            <div class="form-group" th:classappend="${#fields.hasErrors('newPasswordConfirm') ? 'has-error' : ''}">
                <label for="newPasswordConfirm" th:text="#{member.password_reset.new_password_confirm}">새 비밀번호 확인</label>
                <input type="password" id="newPasswordConfirm" th:field="*{newPasswordConfirm}" class="form-control"
                       th:placeholder="#{member.password_confirm.placeholder}" placeholder="비밀번호를 다시 입력하세요" required />

                <div class="error-message" th:if="${#fields.hasErrors('newPasswordConfirm')}">
                    <span th:errors="*{newPasswordConfirm}"></span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{member.password_reset.submit_btn}">비밀번호 재설정</button>
        </form>

        <div class="form-footer">
            <a th:href="@{/members/login}" th:text="#{member.password_reset.back_to_login}">로그인으로 돌아가기</a>
        </div>

    </main>

    <!-- 4. 공통 Footer 프래그먼트 연결 -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
