<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- 1. 공통 Head 프래그먼트 연결 -->
<head th:replace="~{fragments/common :: head(~{::title})}">
    <title th:text="#{member.password_reset.title} + ' - SoraTrip'">🔑 비밀번호 재설정 - SoraTrip</title>
</head>

<body>

    <!-- 2. 공통 Header 프래그먼트 연결 -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- 3. 비밀번호 재설정 요청 폼 -->
    <main class="container form-container">

        <div class="form-header">
            <span class="eyebrow">Reset Password</span>
            <h2 th:text="#{member.password_reset.title}">🔑 비밀번호 재설정</h2>
        </div>

        <p style="color: var(--text-sub); text-align: center; margin-bottom: var(--space-6); font-size: var(--text-sm);" th:text="#{member.password_reset.request_desc}">
            가입하신 이메일로 인증 코드를 보내드립니다.
        </p>

        <form th:action="@{/members/password-reset}" th:object="${passwordResetRequestDto}" method="post" novalidate>
            <div class="form-group" th:classappend="${#fields.hasErrors('email') ? 'has-error' : ''}">
                <label for="email" th:text="#{member.email}">이메일</label>
                <input type="email" id="email" th:field="*{email}" class="form-control" required placeholder="example@soratrip.com" />

                <div class="error-message" th:if="${#fields.hasErrors('email')}">
                    <span th:errors="*{email}"></span>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" th:text="#{member.password_reset.send_code_btn}">인증 코드 발송</button>
        </form>

        <div class="form-footer">
            <a th:href="@{/members/login}" th:text="#{member.password_reset.back_to_login}">로그인으로 돌아가기</a>
        </div>

    </main>

    <!-- 4. 공통 Footer 프래그먼트 연결 -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
