<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- common.html 파일의 head 프래그먼트 불러오기 -->
<head th:replace="~{fragments/common :: head(~{::title})}">
    <title th:text="#{chat.title}">실시간 여행 채팅</title>
</head>

<body>

    <!-- header.html 파일의 header 프래그먼트 불러오기 -->
    <header th:replace="~{fragments/header :: header}"></header>

    <!-- 메인 콘텐츠 영역 (채팅 + 매칭) -->
    <main class="container" style="padding-top: 40px; padding-bottom: 40px; display: flex; justify-content: center;">
        <div style="width: 100%; max-width: 1200px;">
            
            <!-- 채팅 인터페이스 -->
            <div class="chat-container">
                <!-- 채팅방 목록 (왼쪽) -->
                <div class="sidebar">
                    <div class="sidebar-header">
                        <span class="connection-status" id="connectionStatus"></span>
                        <span th:text="#{chat.list_title}">실시간 채팅</span>
                    </div>
                    <div class="chat-rooms-list" id="chatRoomsList">
                        <div class="status" th:text="#{chat.rooms.empty}">채팅방이 없습니다</div>
                    </div>
                </div>

                <!-- 메인 채팅 (오른쪽) -->
                <div class="main-chat">
                    <div class="chat-header" id="chatHeader" th:text="#{chat.header.select_room}">채팅방을 선택하세요</div>
                    <div class="messages-container" id="messagesContainer">
                        <div class="status" th:text="#{chat.messages.empty}">메시지를 보내고 받으세요</div>
                    </div>
                    <div class="input-area">
                        <input
                            type="text"
                            id="messageInput"
                            th:placeholder="#{chat.message.placeholder}"
                            placeholder="메시지를 입력하세요..."
                            disabled
                        >
                        <button id="sendButton" onclick="sendMessage()" disabled th:text="#{chat.send}">전송</button>
                    </div>
                </div>
            </div>

            <!-- 매칭 섹션 -->
            <div class="matching-section">
                <h2 th:text="#{chat.matching.title}">관심사가 비슷한 여행자들</h2>
                <div class="users-grid" id="matchingUsers">
                    <div class="status" th:text="#{chat.loading}">로딩 중...</div>
                </div>
            </div>
            
        </div>
    </main>

    <!-- footer.html 파일의 footer 프래그먼트 불러오기 -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <!-- 스타일 정의 -->
    <style>
        .chat-container {
            width: 100%;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: var(--space-5);
            height: min(640px, 75vh);
        }

        .sidebar {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .sidebar-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, #3b82f6 100%);
            color: var(--text-inverse);
            padding: var(--space-5);
            font-size: var(--text-base);
            font-weight: 700;
            display: flex;
            align-items: center;
        }

        .chat-rooms-list {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-2);
        }

        .chat-room-item {
            padding: var(--space-3) var(--space-4);
            cursor: pointer;
            border-radius: var(--radius);
            transition: background var(--transition-fast), color var(--transition-fast);
            margin-bottom: 4px;
            border-left: 3px solid transparent;
        }

        .chat-room-item:hover {
            background: var(--surface);
        }

        .chat-room-item.active {
            background: var(--primary-soft);
            border-left-color: var(--primary-color);
        }

        .chat-room-item.active .room-name {
            color: var(--primary-color);
        }

        .room-name {
            font-weight: 700;
            font-size: var(--text-sm);
            color: var(--text-main);
            margin-bottom: 3px;
        }

        .room-preview {
            font-size: var(--text-xs);
            color: var(--text-faint);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .main-chat {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .chat-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, #3b82f6 100%);
            color: var(--text-inverse);
            padding: var(--space-5);
            font-size: var(--text-base);
            font-weight: 700;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-5);
            display: flex;
            flex-direction: column;
            gap: var(--space-1);
            background: var(--bg-color);
        }

        .message {
            margin-bottom: var(--space-4);
            animation: slideIn 0.3s var(--ease-out);
            max-width: 78%;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.own {
            align-self: flex-end;
        }

        .message.other {
            align-self: flex-start;
        }

        .message-content {
            padding: 11px 16px;
            border-radius: var(--radius);
            word-wrap: break-word;
            line-height: 1.5;
            font-size: var(--text-sm);
            box-shadow: var(--shadow-xs);
        }

        .message.own .message-content {
            background: linear-gradient(135deg, var(--primary-color) 0%, #3b82f6 100%);
            color: var(--text-inverse);
            border-bottom-right-radius: 4px;
        }

        .message.other .message-content {
            background: var(--surface-elevated);
            color: var(--text-main);
            border: 1px solid var(--border-light);
            border-bottom-left-radius: 4px;
        }

        .message-sender {
            font-size: 11.5px;
            color: var(--text-sub);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .message.other .message-sender { text-align: left; }
        .message.own .message-sender { text-align: right; }

        .message-time {
            font-size: 10.5px;
            color: var(--text-faint);
            margin-top: 4px;
        }

        .message.own .message-time { text-align: right; }
        .message.other .message-time { text-align: left; }

        .input-area {
            padding: var(--space-3) var(--space-5);
            border-top: 1px solid var(--border-light);
            display: flex;
            gap: var(--space-2);
            background: var(--card-bg);
            padding-bottom: max(var(--space-3), var(--safe-area-bottom));
        }

        .input-area input {
            flex: 1;
            min-height: var(--touch-target);
            padding: 12px 18px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-full);
            font-size: var(--text-sm);
            font-family: inherit;
            outline: none;
            background: var(--surface);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
        }

        .input-area input:focus {
            border-color: var(--primary-color);
            background: var(--surface-elevated);
            box-shadow: 0 0 0 4px var(--primary-soft);
        }

        .input-area input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .input-area button {
            background: linear-gradient(135deg, var(--primary-color) 0%, #3b82f6 100%);
            color: var(--text-inverse);
            border: none;
            padding: 0 26px;
            min-height: var(--touch-target);
            border-radius: var(--radius-full);
            cursor: pointer;
            font-weight: 700;
            font-size: var(--text-sm);
            box-shadow: 0 4px 14px var(--primary-glow);
            transition: transform var(--transition-fast), box-shadow var(--transition-fast), opacity var(--transition-fast);
        }

        .input-area button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 22px var(--primary-glow);
        }

        .input-area button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        .matching-section {
            margin-top: var(--space-6);
            padding: var(--space-6);
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .matching-section h2 {
            font-size: var(--text-md);
            margin-bottom: var(--space-4);
            color: var(--text-main);
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: var(--space-3);
        }

        .user-card {
            padding: var(--space-4);
            background: var(--surface);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all var(--transition-base);
            border: 1px solid var(--border-color);
        }

        .user-card:hover {
            background: linear-gradient(135deg, var(--primary-color) 0%, #3b82f6 100%);
            border-color: transparent;
            color: var(--text-inverse);
            transform: translateY(-3px);
            box-shadow: 0 8px 22px var(--primary-glow);
        }

        .user-name {
            font-weight: 700;
            margin-bottom: 4px;
            font-size: var(--text-sm);
        }

        .user-similarity {
            font-size: var(--text-xs);
            opacity: 0.85;
        }

        .status {
            text-align: center;
            padding: var(--space-5);
            color: var(--text-faint);
            font-size: var(--text-sm);
        }

        .connection-status {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--color-error);
            margin-right: var(--space-2);
        }

        .connection-status.connected {
            background: var(--color-success);
            box-shadow: 0 0 6px rgba(23, 166, 115, 0.6);
        }

        @media (max-width: 768px) {
            .chat-container {
                grid-template-columns: 1fr;
                height: auto;
            }
            .sidebar {
                max-height: 220px;
            }
            .main-chat {
                min-height: 68vh;
            }
        }
    </style>

    <!-- WebSocket + STOMP 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <script th:inline="javascript">
        // i18n 메시지 (properties 기반, JS에서 사용할 문구)
        const I18N = {
            roomsEmpty: /*[[#{chat.rooms.empty}]]*/ '채팅방이 없습니다',
            messagesEmptyHistory: /*[[#{chat.messages.empty_history}]]*/ '아직 메시지가 없습니다',
            roomDefaultTitle: /*[[#{chat.room.default_title}]]*/ '채팅방',
            roomWithUser: /*[[#{chat.room.with_user}]]*/ '{0} 님과의 대화',
            senderUnknown: /*[[#{chat.sender.unknown}]]*/ '상대방',
            matchingEmpty: /*[[#{chat.matching.empty}]]*/ '매칭된 사용자가 없습니다',
            similarity: /*[[#{chat.similarity}]]*/ '유사도: {0}%'
        };

        // 전역 변수
        let stompClient = null;
        let currentChatRoomId = null;
        let currentUserId = null; // 서버에서 동적으로 가져올 로그인 유저 ID

        // ==================== 초기화 ====================
        function init() {
            // 1. 내 ID를 먼저 가져온 후 채팅방 및 매칭 목록 로드, 소켓 연결 진행
            fetch('/api/chat/my-id')
                .then(response => response.json())
                .then(userId => {
                    currentUserId = userId;
                    console.log("로그인 사용자 ID:", currentUserId);
                    
                    loadChatRooms();
                    loadMatchingUsers();
                    connectWebSocket();
                })
                .catch(error => console.error('사용자 ID 로드 실패:', error));
        }

        // ==================== WebSocket 연결 ====================
        function connectWebSocket() {
            const socket = new SockJS('/ws/chat');
            stompClient = Stomp.over(socket);
            stompClient.connect({}, onConnected, onError);
        }

        function onConnected() {
            console.log('WebSocket 연결됨');
            updateConnectionStatus(true);
        }

        function onError(error) {
            console.error('WebSocket 에러:', error);
            updateConnectionStatus(false);
        }

        function updateConnectionStatus(connected) {
            const status = document.getElementById('connectionStatus');
            if (status) {
                if (connected) {
                    status.classList.add('connected');
                } else {
                    status.classList.remove('connected');
                }
            }
        }

        // ==================== 채팅방 관리 ====================
        function loadChatRooms() {
            fetch('/api/chat/my-rooms')
                .then(response => response.json())
                .then(rooms => {
                    const container = document.getElementById('chatRoomsList');
                    if (rooms.length === 0) {
                        container.innerHTML = `<div class="status">${I18N.roomsEmpty}</div>`;
                        return;
                    }

                    container.innerHTML = '';
                    rooms.forEach(room => {
                        const roomElement = document.createElement('div');
                        roomElement.className = 'chat-room-item';
                        if (room.id === currentChatRoomId) {
                            roomElement.classList.add('active');
                        }
                        roomElement.innerHTML = `
                            <div class="room-name">${room.otherUserNickname}</div>
                            <div class="room-preview">${room.otherUserName || ''}</div>
                        `;
                        roomElement.onclick = () => selectChatRoom(room.id, room.otherUserNickname);
                        container.appendChild(roomElement);
                    });
                })
                .catch(error => console.error('채팅방 로드 실패:', error));
        }

        function selectChatRoom(roomId, roomTitle) {
            currentChatRoomId = roomId;

            // UI 헤더 이름 변경
            document.getElementById('chatHeader').innerText = roomTitle
                ? I18N.roomWithUser.replace('{0}', roomTitle)
                : I18N.roomDefaultTitle;

            // 메시지 히스토리 로드
            loadMessages(roomId);

            // 입력창 활성화
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendButton').disabled = false;

            // WebSocket 구독
            if (stompClient && stompClient.connected) {
                stompClient.subscribe(`/topic/chat/${roomId}`, onMessageReceived);
            }
        }

        function loadMessages(roomId) {
            fetch(`/api/chat/rooms/${roomId}/messages`)
                .then(response => response.json())
                .then(messages => {
                    const container = document.getElementById('messagesContainer');
                    container.innerHTML = '';

                    if (messages.length === 0) {
                        container.innerHTML = `<div class="status">${I18N.messagesEmptyHistory}</div>`;
                        return;
                    }

                    messages.forEach(msg => {
                        displayMessage(msg);
                    });

                    container.scrollTop = container.scrollHeight;
                })
                .catch(error => console.error('메시지 로드 실패:', error));
        }

        // ==================== 메시지 송수신 ====================
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const content = input.value.trim();

            if (!content || !currentChatRoomId || !stompClient || !stompClient.connected) {
                return;
            }

            // STOMP로 메시지 전송
            stompClient.send(
                `/app/chat/${currentChatRoomId}`,
                {},
                JSON.stringify({ content: content })
            );

            input.value = '';
        }

        function onMessageReceived(message) {
            const msg = JSON.parse(message.body);
            displayMessage(msg);

            const container = document.getElementById('messagesContainer');
            container.scrollTop = container.scrollHeight;
        }

        function displayMessage(msg) {
            const container = document.getElementById('messagesContainer');

            const statusElement = container.querySelector('.status');
            if (statusElement) {
                statusElement.remove();
            }

            // 내가 보낸 메시지 여부 판단 (senderId와 내 ID 비교)
            const isOwn = (msg.senderId === currentUserId);

            const messageElement = document.createElement('div');
            messageElement.className = `message ${isOwn ? 'own' : 'other'}`;

            const time = msg.sentAt ? new Date(msg.sentAt).toLocaleTimeString('ko-KR', {
                hour: '2-digit',
                minute: '2-digit'
            }) : '';

            messageElement.innerHTML = `
                <div class="message-sender">${msg.senderName || I18N.senderUnknown}</div>
                <div class="message-content">${escapeHtml(msg.content)}</div>
                <div class="message-time">${time}</div>
            `;

            container.appendChild(messageElement);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ==================== 매칭 ====================
        function loadMatchingUsers() {
            fetch('/api/chat/matching/similar-users')
                .then(response => response.json())
                .then(users => {
                    const container = document.getElementById('matchingUsers');
                    if (users.length === 0) {
                        container.innerHTML = `<div class="status">${I18N.matchingEmpty}</div>`;
                        return;
                    }

                    container.innerHTML = '';
                    users.forEach(user => {
                        const userCard = document.createElement('div');
                        userCard.className = 'user-card';
                        userCard.innerHTML = `
                            <div class="user-name">${user.nickname}</div>
                            <div class="user-similarity">${I18N.similarity.replace('{0}', (user.similarity * 100).toFixed(0))}</div>
                        `;
                        userCard.onclick = () => createChatWithUser(user.id, user.nickname);
                        container.appendChild(userCard);
                    });
                })
                .catch(error => console.error('매칭 사용자 로드 실패:', error));
        }

        function createChatWithUser(userId, nickname) {
            fetch(`/api/chat/rooms/${userId}`)
                .then(response => response.json())
                .then(chatRoomId => {
                    loadChatRooms();
                    setTimeout(() => {
                        selectChatRoom(chatRoomId, nickname);
                    }, 300);
                })
                .catch(error => console.error('채팅방 생성 실패:', error));
        }

        // ==================== 이벤트 리스너 ====================
        document.addEventListener('DOMContentLoaded', () => {
            const messageInput = document.getElementById('messageInput');
            if (messageInput) {
                messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        sendMessage();
                    }
                });
            }
            init();
        });
    </script>
</body>
</html>
